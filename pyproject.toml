[project]
name = "trellis-workspace"
version = "0.0.0"
description = "Trellis — workspace root for Resource Explorer and Egeria Advisor"
requires-python = ">=3.12,<4.0"
dependencies = []

# No [build-system] section: this makes the workspace root a "virtual" uv
# project (not itself built/installed as a package) — it exists only to
# declare workspace membership and hold shared tooling config.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
resource-explorer = { workspace = true }
egeria-advisor = { workspace = true }
trellis-microflow = { workspace = true }
trellis-vectorstore = { workspace = true }
trellis-artifact-tree = { workspace = true }
trellis-context = { workspace = true }
trellis-querycache = { workspace = true }
trellis-auth = { workspace = true }
trellis-analytics = { workspace = true }

[tool.uv]
# Combining both members' constraints in one resolution otherwise pulls an
# ancient numba (0.53.1 -> llvmlite 0.36.0) via beeai-framework[rag] ->
# unstructured, which doesn't build on Python 3.13. RE's own standalone
# lockfile already resolved numba to 0.65.1 with no such issue — this
# override just restores that same resolution inside the shared workspace.
override-dependencies = [
    "numba>=0.60.0",
    # uvloop 0.17.0 cannot build on Python 3.12+ — it uses PyLongObject.ob_digit,
    # removed in 3.12 — and ships no cp313 wheel, so it falls back to a source
    # build that fails. uvicorn[standard] resolved to it on Linux while macOS
    # got 0.22.1, so `uv sync` worked on every developer machine here and failed
    # on the first CI run (2026-08-23), which is precisely the kind of
    # platform-split breakage nobody finds without a Linux build.
    "uvloop>=0.21.0",
]
