# Trellis Studio's tests: no network, no Egeria, no database. Studio's dependency closure is small (trellis-auth,
# trellis-ui, pyegeria, FastAPI), so this installs only that, from the workspace lock, rather than every member.
name: studio

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "packages/studio/**"
      - "packages/trellis-auth/**"
      - "packages/trellis-ui/**"
      - ".github/workflows/studio.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  studio-tests:
    name: studio-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this change needs the Studio suite
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: the suite always runs"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          python3 .github/scripts/changed_paths.py --base "$BASE" --head HEAD --include \
              "packages/studio/**" \
              "packages/trellis-auth/**" \
              "packages/trellis-ui/**" \
              "pyproject.toml" \
              "uv.lock" \
              ".github/workflows/studio.yml" \
              ".github/scripts/changed_paths.py"

      - name: Install uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.scope.outputs.run == 'true'
        run: uv python install 3.13

      - name: Install Studio and its closure from the lock
        if: steps.scope.outputs.run == 'true'
        # From the workspace root. --package scopes the install to Studio's closure (CI's own throwaway venv;
        # never on a developer tree, where a bare `uv sync --package` drops the other members).
        run: uv sync --package trellis-studio --extra dev

      - name: Studio tests
        if: steps.scope.outputs.run == 'true'
        working-directory: packages/studio
        run: uv run --no-sync pytest tests -q --no-header -rs
