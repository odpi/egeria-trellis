[project]
name = "trellis-auth"
version = "0.1.0"
description = "Shared JWT auth + Portal SSO token exchange — extracted from Egeria Advisor's advisor/auth.py so Resource Explorer can adopt a real login instead of building a second implementation of the same shared-secret contract with the Portal. See docs/trellis-auth-extraction.md."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pyjwt>=2.8.0",
    "starlette>=0.37.0",
]

# Deliberately NOT a dependency: pydantic/pydantic-settings, loguru. This
# package never reads the environment itself (AuthConfig is a plain frozen
# dataclass — each app resolves its own env/YAML into it, same split as
# trellis-querycache/trellis-vectorstore) and never chooses its own logging
# sink (stdlib `logging` only — each app already configures one).
#
# fastapi vs starlette: the only things this package needs from "the FastAPI
# stack" are a `Request` to read headers off of, and an `HTTPException` to
# raise 401s that a FastAPI app's default exception handler already turns
# into JSON responses. Both are starlette types — fastapi.Request and
# fastapi.HTTPException are thin re-exports/subclasses of
# starlette.requests.Request and starlette.exceptions.HTTPException, and a
# FastAPI app installs its default handler for the *starlette* HTTPException,
# so raising the starlette one from here works unchanged inside a FastAPI
# app. Depending on starlette instead of fastapi avoids pulling in
# fastapi's own dependency surface (pydantic, etc.) for a package that
# doesn't otherwise need it.
#
# pyegeria is intentionally NOT a hard dependency (see the `egeria` extra
# below): validate_egeria_credentials() imports it lazily, and a failed
# import is caught by the same broad `except Exception` that already
# handles "Egeria is unreachable" — so the function degrades the same way
# whether pyegeria is missing or Egeria itself is down, and a consumer that
# doesn't need live credential validation doesn't have to install it.

[project.optional-dependencies]
egeria = ["pyegeria>=6.2.18"]  # raised with trellis' floor 2026-10-31
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trellis_auth"]
