[project]
name = "resource-explorer"
version = "0.1.0"
description = "Multi-agent RAG system for scouting, surveying, and understanding information resources — backed by Egeria"
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    # Agent framework
    "agentstack-sdk>=0.7.0",
    "beeai-framework[rag]>=0.1.77",
    "openinference-instrumentation-beeai>=0.1.15",
    # Vector store (pgvector, shared with Egeria Advisor's egeria_advisor Postgres db)
    "pgvector>=0.3.0",
    # Shared microflow resource-sharing primitives (D6, docs/unified-
    # survey-execution-model-plan.md) — packages/trellis-microflow
    "trellis-microflow",
    # Shared vector-store implementation (BaseVectorStore/PgVectorStore),
    # extracted alongside Egeria Advisor's equivalent — packages/trellis-vectorstore
    "trellis-vectorstore",
    # Containment trees over ingested artifacts, OFF by default
    # (ARTIFACT_TREE_ENABLED) — packages/trellis-artifact-tree
    "trellis-artifact-tree",
    # ContextSpec and the deterministic packer, imported by
    # resource_explorer/context_compile.py — packages/trellis-context.
    # Was missing from this list when the context compiler landed: it resolved
    # anyway because the root pyproject lists it under [tool.uv.sources], which
    # makes it available in a workspace-wide sync but does NOT make it a
    # requirement. Any install that resolves resource-explorer alone — CI, a
    # clean per-package install — would have failed on the import.
    "trellis-context",
    # Shared TTL/LRU query cache, extracted alongside Egeria Advisor's
    # equivalent — packages/trellis-querycache
    "trellis-querycache",
    # Shared JWT auth + Portal SSO — packages/trellis-auth. Imported by
    # resource_explorer/a2a_auth.py, which is what makes the `a2a` process
    # role require a bearer token (docs/runtime-architecture-plan.md §4).
    # Declared here and not only in the root's [tool.uv.sources] for the same
    # reason trellis-context is: a sources entry makes a package *available*
    # in a workspace-wide sync, it does not make it a requirement, so a
    # per-package install would fail on the import.
    "trellis-auth",
    # The Analytic Library: Curate's By-analysis tab calls
    # trellis_analytics.routines.curation_coverage (brief 2b). Declared here for the
    # reason trellis-auth is: a root [tool.uv.sources] entry makes it available, not required.
    # trellis-analytics' own `re` extra points back at this package; that is an optional
    # edge, and the route degrades to not_applicable if the import ever fails.
    "trellis-analytics",
    # Embeddings & LLM
    "sentence-transformers>=3.3.0",
    "ollama>=0.4.0",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    # Document ingestion
    "docling>=2.0.0",
    "nbconvert>=7.16.0",
    "PyGitHub>=2.5.0",
    "httpx>=0.27.0",
    # CLI & terminal UI
    "typer>=0.12.0",
    "rich>=13.7.0",
    "plotext>=5.3.0",
    # Web UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Graphing & data
    "plotly>=5.24.0",
    "kaleido>=0.2.1",
    "pandas>=2.2.0",
    # Config & persistence
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    # Observability
    "mlflow>=2.18.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    # Scheduling & security
    "apscheduler>=3.10.0",
    "cryptography>=43.0.0",
    "textual>=8.2.4",
    "openpyxl>=3.1.5",
    "pyarrow>=23.0.1",
    # Egeria integration
    # scripts/create_measure_definitions.py's ValidValueMember linking needs
    # pyegeria>=6.0.18.1 (egeria-python PYEGERIA_ISSUES.md ISSUE-56) — not
    # hard-pinned as a lower bound here: doing so made `uv lock` fail on an
    # unrelated hypothetical win32/python>=3.15 marker split (pyegeria's own
    # metadata is a universal py3-none-any wheel, requires-python>=3.12, so
    # this reads as a uv resolver quirk with a just-published version, not a
    # real incompatibility) — `uv lock --upgrade-package pyegeria` already
    # resolves 6.0.18.1 today without a hard constraint.
    #
    # SurveyDefinitionReader.fetch()/reconcile_step_links() require two
    # pyegeria fixes, both verified live against the real wheel (not assumed):
    #
    #  * GovernanceOfficer.get_governance_action_process_graph — renamed from
    #    get_governance_process_graph (PR odpi/egeria-python#275), shipped in
    #    6.0.18.3. Without it the Survey tab renders every candidate as an
    #    errored card ("object has no attribute ...") with no steps.
    #  * MetadataExpert.delete_related_elements() routing through
    #    DeleteRelationshipRequestBody instead of OpenMetadataDeleteRequestBody
    #    (egeria-python PYEGERIA_ISSUES.md ISSUE-63), shipped in 6.0.18.4. The
    #    old body had no `deleteMethod` field and silently dropped it via
    #    PyegeriaModel's extra='ignore', so reconcile_step_links()' deletes were
    #    a no-op — confirmed live, the reconciler reported removals while the
    #    duplicates stayed put. This matters because Dr.Egeria's "Link
    #    First/Next Process Step" commands are NOT idempotent: re-running a
    #    repo-survey-definition-*.md doc against an already-linked process
    #    duplicates every edge, which makes each step look "branching" and
    #    takes the whole Survey Definition out of service until reconciled.
    #
    # Hence the 6.0.18.4 floor. Raised to 6.1.5 on 2026-08-27 for the
    # engine-host trio (claim_engine_action, update_engine_action_status,
    # get_active_claimed_engine_actions) — see egeria-python's
    # PYEGERIA_ISSUES.md ISSUE-78. Verified against the real wheel, not
    # assumed: full suite, live Egeria smoke tests and a live alignment scan
    # all pass on 6.1.5, and claim_engine_action was exercised against the
    # live platform through the client. Note pyegeria moved MetadataExpert from
    # pyegeria.omvs.metadata_explorer to pyegeria.omvs.metadata_expert in this
    # release; RE is unaffected because it imports from the top-level package.
    # Raised to 6.2.1 for the ISSUE-131 fix (the *_by_name finds now send the
    # type filter when no body is given). 6.2.1 also pins altair==6.3.0 and
    # needs fastapi>=0.141.1; the lock moved altair 6.2.2 -> 6.3.0 with it.
    # Raised to 6.2.3: AssetMaker's action/process queries default activity_status_list to None (ISSUE-148), and
    # AutomatedCuration.get_engine_actions is gone (ISSUE-151); neither is called by RE (AUDIT-PYEGERIA-6.2.3.md).
    # Raised to 6.2.5 (2026-10-16): Egeria main (odpi/egeria#9371) moved the engine-action claim/status/completion/
    # active-claimed calls to the Governance Engine view service; 6.2.5 adds the GovernanceEngine client and routes
    # the old AutomatedCuration methods there (ISSUE-153). Without it the engine host's calls 404.
    # Raised to 6.2.7 (2026-10-21): ISSUE-152 -- update_annotation, update_context_event, update_schema_type,
    # update_schema_attribute and update_subject_area now send their body (before, they sent nothing); 6.2.6 fixed
    # the add/update_catalog_target bodies (ISSUE-156). No dependency changes; the lock moved only pyegeria.
    # Raised to 6.2.8 (2026-10-21): ISSUE-160 -- create_folder_element_from_template sends directoryAddress and
    # deployedImplementationType; CSV/secrets-store/Postgres/UC/Kafka template placeholders are filled and unset
    # optional args no longer leave ~{x}~ literals. The lock moved only pyegeria.
    # Raised to 6.2.9 (2026-10-21): #477 (ISSUE-161) Dr.Egeria entry points resolve the user at run time
    # (--userid > EGERIA_USER > config/.env > default); #478 Postgres Server/Database element commands take
    # secrets-store attributes. RE passes --userid explicitly and generates no Postgres element commands.
    # Raised to 6.2.10 (2026-10-23): #483 (ISSUE-163/164/165) request fields 6.2.9 dropped are now sent -- find_*
    # zone filter, relationship page size, anchor scope, anchorScopeGUIDs, initiate_engine_action startDate; new
    # undo/restore, usage-activity and product-catalog APIs; #482 (ISSUE-162) term/data-designer booleans kept.
    # Audit: RE passes none of those fields (tests/test_pyegeria_6210_request_fields.py). The lock moved only pyegeria.
    # Raised to 6.2.13 (2026-10-27) for the Egeria build with the ISSUE-166 boxed-properties fix (odpi/egeria
    # 12b1aaae #9389, image c2ca054c). 6.2.12 content as below, plus: #498 unset numbers/flags are no longer sent as
    # 0/false (domain_identifier, position, headCount defaults now None) and create_egeria_bearer_token RAISES
    # (PyegeriaUnauthorized/Client/Connection/TimeoutException) instead of returning "FAILED" or the 401 text;
    # #495 security annotation models; #497 Dr.Egeria survey-report/security-finding commands. Audit: RE passes
    # domain_identifier explicitly, sets no position/headCount; every RE annotation body is sent unchanged on 6.2.10
    # and 6.2.13 (14 types compared); trellis-auth's password login already catches the raise. EgeriaClients._mint /
    # refresh now raise on a failed daemon login instead of continuing without a token
    # (tests/test_pyegeria_6213_audit.py).
    # The 6.2.12 audit: #485 (ISSUE-165)
    # routes the endpoints Egeria removed (analysis reports, subject-area membership, find_governance_action_processes,
    # get_gov_def_in_context, data classifications) to their replacements as deprecated wrappers; #487
    # get_platform_organization reads /api/public/app/info; #492/#493 SecurityOfficer statements of applicability;
    # delete_annotation's body is now optional. Audit: RE calls none of the rerouted methods, nor
    # get_platform_organization (tests/test_pyegeria_6212_rerouted_methods.py). No shared client code changed.
    # Raised to 6.2.16 (2026-10-30) for egeria-python #513: pyegeria no longer depends on or applies nest_asyncio;
    # its sync methods go through run_sync (safe from a running loop or a loopless worker thread) and its httpx
    # session is per thread and per loop. RE's four get_event_loop().run_until_complete() sites relied on the
    # nest_asyncio patch and now call the sync method instead; the loop-feeding wrappers around them are gone.
    # Without this, sub-resource publishing quietly created nothing on any thread that had run asyncio.run
    # (tests/test_pyegeria_6216_sync_bridge.py).
    # Raised to 6.2.17 (2026-10-30): #516 refuses an unregistered analytic_function outside the pyegeria /
    # trellis_analytics prefixes; #518 returns kind "absent" (a sentence in content, no data) for not_established /
    # not_applicable; #519 reads the pyegeria.analytics entry-point group (trellis.analytics as an alias), so
    # trellis_analytics' discovery.register() is now redundant but left in place. Audit: RE runs its steps through
    # trellis_analytics.step, not pyegeria's resolver, and reads no exec_report_spec output; every analytic_function
    # trellis names resolves (trellis-analytics tests/test_pyegeria_6217_allowlist.py), and the advisor's two readers
    # of exec_report_spec show "absent" as its sentence (egeria-advisor tests/unit/test_report_absent_kind.py).
    # Raised to 6.2.18 (2026-10-31, project owner): ISSUE-173 reads the pyegeria.report_specs entry-point group, so
    # installing trellis-analytics registers the Portal tile's report spec; PYEGERIA_REPORT_SPEC_MODULES (removed in 6.2.19)
    # is no longer set anywhere in trellis.
    # Raised to 6.2.19 (2026-11-02): the release that removes PYEGERIA_REPORT_SPEC_MODULES and refuses a dotted
    # analytic_function path, so a 6.2.18 venv can no longer pass tests that the 8813 containers would fail.
    "pyegeria>=6.2.19",
    "mcp>=2.0.0",
    # nest-asyncio removed 2026-09-04 with the shared-pool refactor: RE no
    # longer imports it anywhere. Its one site, surveyors/prefect_adapter.py's
    # module-level nest_asyncio.apply(), was both unnecessary (every sync/async
    # bridge now hands the coroutine to a thread with a fresh loop — see
    # resource_explorer/concurrency.py) and redundant (pyegeria then applied it
    # at package import). Since pyegeria 6.2.16 (#513) pyegeria neither declares
    # nor applies it, so nothing in RE's process is patched any more.
    # Database surveying
    "psycopg2-binary>=2.9.0",
    "prefect>=3.0.0",
    "soda-core-postgres>=3.0.0",
    "great-expectations>=0.18.0",
    "sqlglot>=25.0.0",
    # Java code-intelligence extraction (ingestion/java_symbol_extractor.py) —
    # promoted out of the optional [ast] extra below: Java symbol/relationship
    # data became load-bearing for Egeria Advisor's consumption (AST-ownership-
    # transfer plan) once code intelligence is more than a chunking nicety.
    "tree-sitter>=0.21",
    "tree-sitter-java>=0.21",
    # Structural code-marker detection engine for architecture recovery
    # (docs/architecture-recovery.md §5.1, Detectors first). A pip dependency rather
    # than a system prerequisite on purpose: `ast-grep-cli` publishes
    # prebuilt wheels for macOS arm64/x86_64, manylinux aarch64/x86_64 and
    # Windows, at version parity with Homebrew, so `uv sync` provisions the
    # binary and uv.lock pins it. Nobody has to `brew install` anything.
    #
    # This is the general answer to §5.7's binary-provisioning gap, not a
    # one-off: prefer a wheel-distributed or Python-native implementation
    # (ast-grep-cli here, lizard for complexity) and accept a modest
    # performance cost, reserving true system binaries for capabilities with
    # no alternative (syft/trivy) — which are Analysis-tier and optional, and
    # should declare themselves unavailable rather than fail a survey.
    "ast-grep-cli>=0.45.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "watchfiles>=1.0.0",
]
phoenix = [
    "arize-phoenix>=5.0.0",
]
redis = [
    "redis>=5.0.0",
]
ast = [
    # tree-sitter / tree-sitter-java are core dependencies now (see above).
    # javascript/go are used both for pgvector chunk-boundary splitting
    # (ast_chunker.py) AND for symbol extraction (js_symbol_extractor.py /
    # go_symbol_extractor.py) — kept optional rather than promoted to base
    # deps like Java was, since the regex extractors they upgrade still work
    # as a fallback when this extra isn't installed (CodeSymbolExtractor
    # degrades gracefully; Java has no such fallback, hence its promotion).
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-go>=0.21",
]

[project.scripts]
resource-explorer = "resource_explorer.cli.main:app"

# The Analytic Library's reader seam (LS2): the library owns what a routine may read (trellis_analytics.readers) and
# finds who answers it through this group; nothing in the library imports resource_explorer. RE is the one
# implementation. Without RE installed (the Portal) a routine that asks answers not_established in words: "no reader
# installed for ods here", "no reader for Resource Explorer's catalogue is installed here"; discovery's two warn-only
# checks are skipped with a warning. ods and catalogue_scope still live in the library's tree until the library leaves
# trellis (LS2 step 3), then with RE.
[project.entry-points."trellis_analytics.readers"]
ods = "trellis_analytics.readers.ods:OdsReader"
catalogue_scope = "trellis_analytics.readers.registry_view:CatalogueScopeReader"
investigation_purposes = "resource_explorer.investigation_purposes:known_purpose_names"
question_ids = "resource_explorer.surveyors.question_catalog_reader:all_question_ids"

[tool.hatch.build.targets.wheel]
packages = ["resource_explorer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A hanging test must fail with a name, not stall silently. CI's first full-suite
# run stopped dead at 46% and was killed by the job timeout 3 minutes later,
# reporting only "The operation was canceled" — no test name, no traceback, no
# way to tell a hang from a slow runner. 120s is far above any real test here
# (the whole suite runs in ~2 minutes locally), so this only ever fires on
# something genuinely stuck.
timeout = 120
timeout_method = "thread"