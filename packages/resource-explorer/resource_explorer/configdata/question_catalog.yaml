    kind: gap
    analysis_ids: []
    checks: []
    note: 'GAP: similarity search over pgvector embeddings (not built) — content similarity; an Agent
      over RAG can describe how two resources differ once candidates exist'
  answering_mechanism: RAG Queries + Agent-Based Analysis
  rationale: 'Content similarity over embeddings of code, documents and sampled data (pgvector). Complements
    scope similarity (which needs declared or measured scope) and structural similarity (which needs a
    schema). Design §16.7 5′ and the coverage audit''s similarity item: content finds candidates; scope
    fit ranks them.'
  catalog_history: '2026-09-26: split from ''What are similar resources, and how does this differ?'' (project
    owner: ''tease apart what we mean by similar — scope, database type, data objects''); three questions
    now — content similarity (RAG), scope similarity (lens fit), structural similarity (fingerprint, the
    pre-existing copy/subset row).'
  retired: false
