    checks: []
    note: 'coverage_signals (design §16.2, §16.3 — period from pg_stats histogram bounds and exact min/max
      where a native survey stored them; absence of bounds is reported as "run ANALYZE / credential cannot
      see pg_stats", NEVER as "no dates", and "no date column at all" is a separate, measured negative.
