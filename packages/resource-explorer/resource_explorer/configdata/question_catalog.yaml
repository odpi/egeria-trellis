  answering_mechanism: Database Catalog Query
  rationale: 'design §16.2: pg_stats histogram bounds give a date column''s min and max WITHOUT reading
    rows. Its own warning is the load-bearing part — "absent means ''run ANALYZE'', not ''no dates''"
    — so the two states are separately named rather than collapsed.'
  catalog_history: '2026-09-24: added with multi-resource-questions-design.md §16.3''s Scouting/Discovery
    rows. §16.3 files this question under Scouting; it is recorded as Discovery here (and tagged intent:
    discovery in analysis_catalog.yaml) because CLAUDE.md rule 17''s axis is "does this collect, or reason
    over what is already collected" and this reasons over stored rows — the same judgement that already
    placed grain_determination, also a §16.3 Scouting row, in Discovery. §16.2''s Scouting placement is
    about the signal being free, and it is: no fetch is added. | 2026-10-22: Purpose Find added (owner
    ruling 2026-10-13: Find and Integrate are Egeria valid values; review §1.7).'
  retired: false
- id: Q-0077
  question: Could this be in scope for what I am looking for — worth the full pass?
  stage: Discovery/Enrichment
  perspectives:
  - Financial
  - Consumer
  purposes:
  - Explore
  - Select
  - Find
  levels:
  - container
  answering:
    kind: analysis
    analysis_ids:
    - grain_determination
    - subject_signals
    - coverage_signals
    - preliminary_fit
    checks: []
    note: 'preliminary_fit (design §16.3, §16.5 — zero-fetch comparison of subject_signals, coverage_signals
      and grain_determination''s time grain against a supplied data requirement, with per-input confidence.
      Four verdicts kept distinct: fits; does not fit; could_not_check when an input was itself not established
      — the pg_stats/ANALYZE case, never rendered as either of the first two; and "no requirement declared"
      when none is supplied, which carries what the resource COULD satisfy instead of a vacuous pass.
      Regions, data classes and grain statements are carried through as deferred criteria naming the analysis
      that answers them, never scored here. GAP, deliberate and scoped: the full DataLens governance definition
      — versioned, investigation-scoped, with Curate-tier "make this my lens" actions, §16.5 points 3-5
      — is not built; this takes a plain lens mapping or none, on §16.6''s own authority)'
  answering_mechanism: Database Catalog Query + Local Registry Query
  rationale: design §16.3's Discovery gate and §16.5 point 2 — fit is a query over stored measurements,
    not a survey, so changing the requirement recomputes fit across every already-surveyed resource at
    zero fetch cost, and the same question works with no requirement at all as a comparison across resources.
  catalog_history: '2026-09-24: added with multi-resource-questions-design.md §16.3''s Discovery gate.
    Built WITHOUT the full DataLens governance-definition model (§16.5 points 3–5), on §16.6''s own authority
    — "preliminary_fit works before it exists, as a comparison across resources". It takes a plain lens
    mapping using §16.6''s scopeElements key names, or none at all, in which case it renders "no requirement
    declared" plus what the resource could satisfy. | 2026-10-22: Purpose Find added (owner ruling 2026-10-13:
    Find and Integrate are Egeria valid values; review §1.7).'
  retired: false
