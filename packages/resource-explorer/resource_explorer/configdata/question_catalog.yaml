    analysis_ids:
    - data_class_match
    checks: []
    note: 'data_class_match (Phase 1 slice 10, design §5.4/§5.8 — matches column name, type and bounded
      value sampling against every Egeria DataClass the platform holds, producing a DataClassAnnotation
      per column; an unmatched-but-patterned column is proposed as a new DataClass with contentStatus:
      DRAFT, linked to its evidence via AssociatedAnnotation)'
  answering_mechanism: Value Profiling + Egeria Queries
  rationale: 'Generalises the existing PII matching: column name, type and sampled value patterns matched
