    seq_scan and idx_scan; pg_stat_database carries the transaction and block counters. All of it is a
    catalog read. Note the two absence modes design §5.1 calls out: a counter the engine does not support
    is not_established, and statistics that were never collected must render as "run ANALYZE", not as
    "no activity".'
  catalog_history: ''
  retired: false
