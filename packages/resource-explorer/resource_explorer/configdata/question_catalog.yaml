  answering_mechanism: Direct Field
  rationale: Purpose/description — from the repo's own GitHub description field, no deeper analysis required.
  catalog_history: '2026-09-21: reworded from repo-only to cross-type wording (multi-resource-questions-design.md
    §4) as part of the re/db-questions-csv authoring stream.'
