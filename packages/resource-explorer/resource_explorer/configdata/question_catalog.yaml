- id: Q-0011
  question: Which resources overlap with this one — the same data, a subset, a stand-in or a replacement
    — and how does this one differ?
  stage: Discovery
  perspectives:
  - Community
  - Security
  - Admin
  purposes:
  - Select
  - Find
  levels:
  - resource
  - container
  answering:
    kind: mixed
    analysis_ids: []
    checks: []
    note: 'MIXED: preliminary_fit + coverage_signals + subject_signals + grain_determination (the lens
      is derived from a resource rather than an investigation — design §16.5 ''lens from a resource'';
      the comparison is requirement_fit''s field-by-field overlap); for repositories and file systems
      the same question is a registry query over already-registered resources and a description-embedding
      similarity, neither of which is built (absorbed from Q-0009 and Q-0010)'
  answering_mechanism: Analysis (lens fit over stored scope)
  rationale: 'Scope similarity is lens fit (design §16.5): derive a lens from this resource''s declared
    or measured DataScope, DataGrain and subject terms and run the fit against every other resource''s
    stored scope — no new survey, a query over stored measurements. Runs both ways, so a resource that
    fails one investigation''s lens can still match another (§16.5 point 5). Also the mechanism behind
    ''is something like this already productised'' (§16.7 5′). The answer is a relation per scope axis
    — subject, population (which customers: pre-sales vs post-sales), space, time, grain, structure —
    each same / contains / contained_by / overlaps / disjoint / not_established, with ''can one stand
    in for the other'' and ''is one a subset of the other'' derived from them (design §16.8). Two ''customer''
    databases are never called similar on subject alone: an undeclared population axis renders not_established.
    Absorbs Q-0009 (replace or extend something we already have) as the stand-in and replacement clause,
    and Q-0010 (similar content) as evidence for the same relation; Q-0070 stays at container level as
    the structural-signature evidence for databases and file systems.'
  catalog_history: '2026-09-26: split from ''What are similar resources, and how does this differ?'' (project
    owner: ''tease apart what we mean by similar — scope, database type, data objects''); three questions
    now — content similarity (RAG), scope similarity (lens fit), structural similarity (fingerprint, the
    pre-existing copy/subset row). | 2026-09-26: rationale extended with the per-axis relation model (design
    §16.8) after the owner''s pre-sales/post-sales and NY/US examples. | 2026-10-22: reworded and widened
    to every kind with an adapter; absorbs Q-0009 (''Does it replace or extend something we already have?'')
    and Q-0010 (''Which resources have similar content — code, documentation or data values — and how
    does this one differ?''); `dataset` withdrawn from Resource Types (review §1.1, §1.6).'
  retired: false
