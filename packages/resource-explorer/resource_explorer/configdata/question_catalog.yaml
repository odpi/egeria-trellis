    - repo_conventions
    checks:
    - repo_conventions:deployment_docker
    note: 'deployment_evidence + repo_conventions (deployment_docker presence signal) [checks: repo_conventions:deployment_docker]'
  answering_mechanism: Code Analysis
  rationale: Covers which deployment evidence each declared distribution has — a console entry point,
    a __main__.py, an unambiguous Dockerfile, compose file or Helm chart, a web-framework dependency —
    and whether a Dockerfile, compose file or Helm chart is present at all.
  catalog_history: 'Presence became a cheap Discovery-tier signal through repo_conventions'' deployment_docker
