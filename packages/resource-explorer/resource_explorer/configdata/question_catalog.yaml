      remains a human judgement, and likely needs a per-dependency answer rather than one blanket answer
      for the whole question. May also become an Agent over RAG content.'
  answering_mechanism: Egeria Queries + Human-Supplied
  rationale: Needs the org's own tech inventory — human-supplied cross-reference, not resource-derivable.
  catalog_history: '2026-09-12: stage widened to Analysis/Enrichment — the answer is human-supplied via
    Enrichment (says so in Answering Analysis), but exact phase matching kept the row off the Enrichment
    pane, under a heading that promised the catalog''s questions for a person. | 2026-09-12: answering
    became MIXED — dependency_support added as the machine starting point (project owner: ''A now, shaped
    to seed B''); the human corroboration stays. | 2026-10-22: Purpose Integrate added (owner ruling 2026-10-13;
    review §1.7).'
  retired: false
- id: Q-0015
