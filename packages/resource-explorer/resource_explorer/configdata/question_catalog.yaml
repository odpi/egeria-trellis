- id: Q-0106
  question: Which files are duplicates of each other, or of files in another registered file system?
  stage: Analysis
  perspectives:
  - Financial
  - Steward
  - Data Expert
  purposes:
  - Assess
  - Maintain
  levels:
  - resource
  answering:
    kind: analysis
    analysis_ids:
    - fs_duplicates
    checks: []
    note: fs_duplicates
  answering_mechanism: Code Analysis
  rationale: fs_duplicates groups the files the walk hashed (SHA-256 under the walk's size limit) by size
    and hash, here and against other registered file systems' newest walks. With no hashes it reports
    'not measured', never 'no duplicates'.
  catalog_history: '2026-10-28: added: F6 of the Files brief (§2), the second slice the owner named on
    2026-10-20 ("follow"); built as Files build step 6.'
  retired: false
- id: Q-0107
  question: Which files has nobody touched for a long time, and which are hot?
  stage: Analysis
  perspectives:
  - Financial
  - Steward
  - Data Owner
  purposes:
  - Maintain
  - Assess
  levels:
  - resource
  answering:
    kind: analysis
    analysis_ids:
    - fs_activity
    checks: []
    note: fs_activity
  answering_mechanism: Code Analysis
  rationale: fs_activity ages each file's modified time, and its access time where the mount records one,
    at the walk's own time. Where access times are not recorded it says 'can't tell', never 'cold'.
  catalog_history: '2026-10-28: added: F8 of the Files brief (§2), the second slice the owner named on
    2026-10-20 ("follow"); built as Files build step 6.'
