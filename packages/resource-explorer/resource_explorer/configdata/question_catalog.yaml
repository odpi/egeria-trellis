    - grain_determination
    - subject_signals
    - coverage_signals
    - preliminary_fit
    checks: []
    note: 'MIXED: preliminary_fit + coverage_signals + subject_signals + grain_determination (the lens
      is derived from a resource rather than an investigation — design §16.5 ''lens from a resource'';
      the comparison is requirement_fit''s field-by-field overlap)'
  answering_mechanism: Analysis (lens fit over stored scope)
  rationale: 'Scope similarity is lens fit (design §16.5): derive a lens from this resource''s declared
    or measured DataScope, DataGrain and subject terms and run the fit against every other resource''s
    stored scope — no new survey, a query over stored measurements. Runs both ways, so a resource that
    fails one investigation''s lens can still match another (§16.5 point 5). Also the mechanism behind
    ''is something like this already productised'' (§16.7 5′). The answer is a relation per scope axis
    — subject, population (which customers: pre-sales vs post-sales), space, time, grain, structure —
    each same / contains / contained_by / overlaps / disjoint / not_established, with ''can one stand
    in for the other'' and ''is one a subset of the other'' derived from them (design §16.8). Two ''customer''
    databases are never called similar on subject alone: an undeclared population axis renders not_established.'
  catalog_history: '2026-09-26: split from ''What are similar resources, and how does this differ?'' (project
    owner: ''tease apart what we mean by similar — scope, database type, data objects''); three questions
