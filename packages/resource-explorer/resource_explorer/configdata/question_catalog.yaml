  answering:
    kind: analysis
    analysis_ids:
    - fs_layout_signals
    checks: []
    note: fs_layout_signals
  answering_mechanism: Code Analysis
  rationale: fs_layout_signals matches the names on the walk's kept rows (project manifests and .git directories,
    dated and partition folders, dictionary and schema files, archive and backup names) without opening
    a file; it also supplies the backup evidence Q-0066 asks for. With no walk it reports 'not measured',
    never 'nothing recognised'.
