    checks: []
    note: 'repository_health + chaoss_metrics (for a repository: contributor identities and concentration;
      declares list extent: top contributors by commit share, with names. For any other kind: the owner
      recorded in Enrichment, plus the owner role credential_capability reads for a database)'
  answering_mechanism: Git Statistics
  rationale: repository_health alone answers 'is it maintained', not 'by whom' — the two questions returned
    the same text until chaoss_metrics, built on project_commits, gave this one its own source.
  catalog_history: '2026-09-21: reworded from repo-only to cross-type wording (multi-resource-questions-design.md
    §4) as part of the re/db-questions-csv authoring stream. | 2026-10-22: answering names what answers
    the other kinds instead of chaoss_metrics alone (review §2); declares its list extent (addendum 1).'
  retired: false
- id: Q-0004
  question: How widely adopted and active is the community around this repository?
  stage: Scouting
  perspectives:
