      candidate: false
      native_process_ref: null
    declaration:
      result_kind: table
      table:
        columns: [title, outcome, words]
        key_fields: [title]
      result_kind_note: "One row per dataset of the work list with its outcome (scouted, or could not be scouted and why); none of the other kinds fits a per-dataset outcome list."
      measures:
      - name: datasets_scouted
        unit: datasets
        as_of: retrieved_at
        value_field: scouted
      - name: datasets_not_scouted
