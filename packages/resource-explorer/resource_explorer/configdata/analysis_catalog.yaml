  - id: db_resilience
    name: "Operational Resilience"
    description: "MIXED analysis (design §5.5): catalog half — primary/standby, replicas and lag, WAL archiving status, backup-tool/Citus-clustering signals — measured directly; Enrichment half (last backup date, restore-test date, RPO/RTO) is not machine-observable and stays explicitly pending, never silently omitted."
