        measured_nothing: 'Scouted: the portal states nothing the dataset did not already hold.'
      extents:
      - name: rows
        fields: [title, outcome, words]
        rows: 25
        order: datasets that could not be scouted first
        truncation: '{shown} of {total} datasets shown, those not scouted first'
        token_cost: 600
