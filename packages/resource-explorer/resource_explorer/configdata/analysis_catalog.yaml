  - id: architecture_recovery
    name: "Architecture Recovery"
    description: "Recover candidate architecture components from package manifests, deployment units (Dockerfile/compose), ast-grep code markers, and import/co-change coupling — a component partition proposal with confidence and evidence, not a published blueprint (docs/architecture-recovery-phase1-plan.md)."
    resource_types: ["repo"]
    # Retagged to discovery 2026-08-22 (maintainer's ruling), then RE-RETAGGED
    # to analysis 2026-08-30 (Dan, directly: "architecture recovery is an
    # analysis step and belongs there") — reversing the earlier call rather
    # than layering a second exception on top of it. This closes the "Open,
    # unresolved" question the PROFILED note below's Backlog entry named —
    # intent on OTHER grounds than cost — separately from the cost question,
    # which that same entry had already settled the other way (see below:
    # `run_time: fast` stays). Both rulings reached the catalog the same day
    # from two different sessions; recorded together here so neither reads as
    # having overridden the other.
    intent: analysis
    perspectives: ["Architecture", "App/AI Builder"]
    annotation_types: ["ResourceMeasureAnnotation", "RequestForActionAnnotation"]
    source: local
    # PROFILED 2026-08-30 (docs/Backlog.md, "architecture_recovery costs 110s
    # to fetch and 5.9s to run — fix the acquisition") — `fast` is right about
    # COMPUTE, and the whole question turned out to be acquisition rather than
    # tiering:
    #   analysis compute, local checkout   5.9s  (detect 3.1 + coupling 2.8)
    #   zipball + treeless clone          15.7s
    #   the same two steps via the route 110.5s
    #
    # phase1-findings §3's "5.3s per repo" is correct and still holds for
    # compute. cProfile pinned the gap to `git_clone_root`'s
    # --filter=blob:none clone: co-change's git history commands lazily fetch
    # from the remote against a treeless clone, so ~92s of a run is git's
    # network time in a child process — invisible to whatever counts
    # connections, which is a separate small bug the Backlog entry also
    # records (a compute_cost guard misattributed 92s of network as compute).
    #
    # `run_time: fast` STAYS (Dan's steer, per that entry: "the work likely
    # goes into the analysis implementation, not the catalog") — it was never
    # wrong about compute, only silent about acquisition, and the two
    # candidate fixes below are aimed at making the acquisition converge
    # toward the compute figure rather than at re-tagging around it. If
    # neither fix lands, the honest tag is about the whole experience and this
    # question comes back — the entry says so explicitly.
    #
    # BOTH candidate fixes from that entry are now DONE (2026-08-30):
    #   1. Give co-change what it actually needs — `git log --name-only`'s
    #      default INEXACT rename detection scores blob-content similarity,
    #      which is exactly what defeats --filter=blob:none (86 lazy
    #      fetches, confirmed by packet trace). Fixed with
    #      --find-renames=100% (dwolfson-59, re/deferred-cleanup-followups
    #      commit 63e7ec6).
    #   2. Cache the acquired roots — `SourceCache` (github/source_cache.py)
    #      keys zipball_root/git_clone_root's downloads on (repo, commit
    #      sha), shared ACROSS SurveyOrchestrator.run() calls rather than
    #      only within one. `_default_branch_sha` now delegates to
    #      `get_latest_commit_sha` (one API call) rather than reimplementing
    #      it — no longer an unused method; it also backs IncrementalIndexer
    #      and the CLI wizard. Built by dwolfson-59, reviewed by S1
    #      (fbc19d7: fixed a lost subproject_path validation on the cached
    #      path, added integration test coverage; 79eaf5b: closed an
    #      eviction race with a grace window after review pushback).
    #
    # Measured result: acquisition 22.64s cold -> 1.28s warm; full route for
    # egeria_python_git 110.5s originally -> 14.4s now. `run_time: fast`
    # stays right about compute, same reasoning as above — what changed is
    # that `availability` no longer derives from it (Dan's separate ruling,
    # same day): this entry is fast AND queued, since a compile running it
    # inline would still pay acquisition. See docs/Backlog.md's entry for
    # the full history across all three sessions that touched this.
    run_time: fast
    # Queued STRUCTURALLY, not by omission: this acquires git_clone_root + zipball_root, so a
    # context compile running it inline would download on its hot path.
    # Declared rather than left to default so "deliberately queued" is
    # distinguishable from "nobody has considered this yet".
    availability: queued
    action: survey
    target_shape: corpus
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

