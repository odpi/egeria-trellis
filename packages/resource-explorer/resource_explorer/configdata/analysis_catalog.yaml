    description: "Database-wide roll-up of pg_stat_user_tables tuple counters and scan counts: is anything reading or writing at all, database-wide, since the last statistics reset. Reuses postgres_schema_and_stats' per-table figures rather than re-querying them (design §5.2, §5.7)."
    resource_types: ["database"]
