database_analyses:
  - id: schema_inventory
    name: "Schema Inventory"
    description: "List all schemas, tables, columns with types, constraints, primary keys, foreign keys, and comments."
    resource_types: ["database"]
    intent: scouting
    perspectives: ["all", "Administration"]
    annotation_types: ["SchemaAnalysisAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: single_container
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: list
      listing:
        item_fields: [schema_name, table_name, table_type, column_count, row_count]
        order: 'by schema, then table'
        key_field: table_name
        item_label: tables, views and foreign tables
      measures:
      - name: relations
        unit: tables, views and foreign tables
        as_of: run.surveyed_at
        value_field: relation_count
        annotation:
          type: SchemaAnalysisAnnotation
      - name: columns
        unit: columns
        as_of: run.surveyed_at
        value_field: column_count
        annotation:
          type: SchemaAnalysisAnnotation
      - name: schemas_with_tables
        unit: schemas
        as_of: run.surveyed_at
        value_field: schemas_with_tables
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not measured: no survey has read this database''s schema yet.'
        not_permitted: 'Not permitted: the credential sees only part of this database, so the inventory covers what
          it could see, not every schema.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: the schemas the credential can see hold no tables.'
      extents:
      - name: relations
        fields: [schema_name, table_name, table_type, column_count, row_count, row_count_is_estimate]
        rows: 30
        sort: [schema_name asc, table_name asc]
        truncation: '{shown} of {total} relations shown, by schema and name'
        token_cost: 1480
        citation: '{analysis} · {scope} · as of {as_of}'
        source: [tables]
      confidence:
        form: measured
      scope: resource

  - id: row_count_snapshot
    name: "Row Count Snapshot"
    description: >
      Count rows in all tables using pg_stat_user_tables. Records a
      time-series data point for trend analysis. Also profiles columns from
      pg_stats (null fraction, distinct count, frequent values — without
      sampling), reads tuple counters/dead-row/scan activity from
      pg_stat_user_tables, and flags unused indexes from
      pg_stat_user_indexes. A capability the connection's engine does not
      support, or a table ANALYZE has never touched, is reported as such
      rather than as zero.
    resource_types: ["database"]
    intent: scouting
    perspectives: ["all", "Administration"]
    annotation_types: ["ResourceMeasureAnnotation", "RequestForActionAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: distribution
      categories:
        exclusive: true
      measures:
      - name: total_rows
        unit: rows
        as_of: run.surveyed_at
        value_field: total_row_count
        annotation:
          type: ResourceMeasureAnnotation
      - name: total_size
        unit: bytes
        as_of: run.surveyed_at
        value_field: total_size_bytes
        confidence: {form: measured}  # pg_total_relation_size: an exact read, unlike the row-count estimate
        annotation:
          type: ResourceMeasureAnnotation
      - name: estimated_relations
        unit: tables
        as_of: run.surveyed_at
        value_field: estimated_count
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not measured: no row count is recorded — a table nobody has analyzed or written to since a restore
          reads as unknown, never as empty.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read pg_stat_user_tables
          for these tables, so it is not measured.'
        not_applicable: 'Not applicable: a view holds no rows of its own.'
        measured_nothing: 'Measured: every table counted holds no rows.'
      extents:
      - name: tables_by_rows
        fields: [schema_name, table_name, row_count, size_bytes, row_count_is_estimate]
        rows: 20
        sort: [row_count desc]
        truncation: '{shown} of {total} tables shown, by row count'
        token_cost: 840
        citation: '{analysis} · {scope} · as of {as_of}'
        source: [tables]
      confidence:
        form: estimated
        basis: tables.row_count_is_estimate
        method: PostgreSQL's row-count estimate, not a count of the rows
      scope: resource

  - id: privilege_audit
    name: "Privilege Audit"
    description: "Roles, table grants and default ACLs from pg_roles/role_table_grants/pg_default_acl; raises a Request For Action on any PUBLIC grant. Backed by the postgres_operations step (design §5.4, §5.7) as of Phase 1 slice 8 — previously database-only/aspirational with no dedicated queries."
    resource_types: ["database"]
    intent: assessment  # scores grant/role hygiene — unchanged
    perspectives: ["Security", "Administration"]
    annotation_types: ["ResourceMeasureAnnotation", "RequestForActionAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: finding
      finding:
        what_field: privilege_type
        where_field: table_name
      measures:
      - name: roles
        unit: roles
        as_of: run.surveyed_at
        value_field: roles[]
        annotation:
          type: ResourceMeasureAnnotation
      - name: table_grants
        unit: grants
        as_of: run.surveyed_at
        value_field: table_grants[]
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not measured: no survey has read this database''s roles and grants yet, or the read failed.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read pg_roles or the table
          grants, so it is not measured.'
        not_applicable: 'Not applicable: this database''s engine has no roles or grants to read.'
        measured_nothing: 'Measured: no grant to PUBLIC was found.'
      extents:
      - name: table_grants
