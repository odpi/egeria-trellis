# Externalized analysis catalog — the menu of analyses available per
# resource type, shown in the Assessment/Analysis/Curate intent panes and
# used by the scheduler (resource_explorer/scheduler.py) to run analyses
# on a cadence.
#
# This is the local counterpart to Egeria's find_technology_types /
# get_tech_type_detail. The two ARE merged at read time —
# resource_explorer/surveyors/analysis_catalog_reader.py optionally calls
# EgeriaTechTypeCatalog.get_produced_annotation_types() and appends
# Egeria-native entries alongside these local ones (fail-soft: if Egeria
# is unreachable, only the local entries below are returned).
#
# IMPORTANT — intent values: this catalog uses the FULL 7-intent scheme
# (scouting / assessment / discovery / analysis / enrichment /
# understanding / curate), which supersedes the 4-intent list still
# documented in this package's CLAUDE.md as of this writing (Scouting /
# Assessment / Discovery / Enrichment only) — update that doc's "Four User
# Intents" section to match once the intent-shell UI work is complete.
# 'discovery' and 'enrichment' currently have zero entries here by design:
# Discovery is served entirely by survey_definitions.py (the Survey
# Definition / GovernanceActionProcess catalog), and Enrichment by
# context.py + activity.py (human-provided context, RFA response) — not
# by this analysis menu. That's not an oversight.
#
# Each entry fields:
#   id               - stable identifier; referenced by resource_schedules
#                       rows (scheduler.py) and must never change once an
#                       analysis has been scheduled anywhere.
#   name, description - shown in the UI card.
#   resource_types    - which of repo/database/filesystem this applies to.
#   intent            - one of the 7 canonical intents (see above).
#   perspectives      - persona tags; "all" plus zero or more of
#                       dba/data_scientist/steward/security. Concurrent
#                       multi-select in the UI, OR-matched.
#   annotation_types  - Egeria annotation type names this analysis produces
#                       when run (used for cross-referencing, not enforced).
#   source            - "local" (RE's own surveyors) or "egeria" (native
#                       Egeria survey/catalog action).
#   run_time          - fast | minutes | async — UI speed badge.
#   action            - "survey" (read-only analysis) or "publish" (writes
#                       to the Egeria catalog of record).
#   target_shape      - repo scope-narrowing funnel plan (docs/repo-scope-
#                       narrowing-funnel.md), D5/D6 — what shape of target
#                       this analysis can mechanically operate on if scope
#                       is narrowed below "the whole resource":
#                         corpus             - the whole resource, or any
#                                              container + everything
#                                              recursively below it (a
#                                              path-prefix filter).
#                         single_container   - a real hierarchy exists
#                                              (e.g. database schema->table)
#                                              but doesn't recurse
#                                              arbitrarily deep.
#                         whole_resource_only - the data is inherently one
#                                              aggregate for the whole
#                                              resource; narrowing it is a
#                                              different analysis, not a
#                                              query change.
#                       Grounded in a real code audit (see that doc's
#                       "Target-shape inventory"), not guessed — RE's own
#                       best judgment, not gospel; a new analysis kind
#                       declares its own shape here, no Python change
#                       needed elsewhere for the compatibility check to
#                       pick it up. Mixed-output kinds take their single
#                       most-restrictive shape (simplicity over per-output
#                       tagging, until real friction shows up).
#   recommended       - shown with a ★ star as a suggested starting point.
#   egeria_registration - schema-only hook for eventual GovernanceActionType
#                       registration of this analysis as a native Egeria
#                       action. NOT a registration mechanism — just a place
#                       to record whether one exists/is planned, and if so
#                       which (entity_type, technology_type) pair it maps
#                       to in technology_type_processes.yaml.
#     candidate         - bool, is this a realistic candidate for Egeria
#                         native registration.
#     native_process_ref - [entity_type, technology_type_name] pointing into
#                         technology_type_processes.yaml, or null if no
#                         confirmed native process exists yet. Never guess
#                         this string — only set it once confirmed live via
#                         find_governance_definitions, same rule as that
#                         file's own header comment.

repo_analyses:
  - id: language_file_classification
    name: "Language & File Classification"
    description: "Identify programming languages, file types, and project structure. Produces file-type counts and language breakdown."
    resource_types: ["repo"]
    intent: scouting
    perspectives: ["Data Expert", "Architecture", "all"]
    annotation_types: ["ResourceMeasureAnnotation", "ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: repository_health
    name: "Repository Health"
    description: "Stars, forks, contributors, open issues, and activity metrics from GitHub. Produces a quality score annotation."
    resource_types: ["repo"]
    intent: scouting
    perspectives: ["Community", "Consumer", "Steward"]
    annotation_types: ["QualityScoreAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: dependency_analysis
    name: "Dependency Analysis"
    description: "Scan package manifests (pyproject.toml, package.json, pom.xml, etc.) for dependencies by ecosystem."
    resource_types: ["repo"]
    intent: analysis  # was 'assessment' — structural/quantitative, not a scored evaluation
    perspectives: ["all", "Security"]
    annotation_types: ["DataClassAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: security_scan
    name: "Security Hygiene"
    # Renamed from "Security Scan" 2026-08-31, and the description rewritten,
    # because both claimed work this step has never done. It checked -- and
    # still checks -- exactly three file-presence facts. It does NOT detect
    # hardcoded secrets, insecure patterns, signed commits, CVEs or anything
    # requiring SAST. The Python class was renamed SecuritySurveyor ->
    # SecurityHygieneSurveyor for precisely this reason; that honesty stopped
    # at the class and never reached the two fields a user actually reads, so
    # "Security Scan: passing" on a published repo meant "has three files".
    # The id stays `security_scan` deliberately: it keys existing schedules
    # and stored findings. Real scanning belongs in new entries under the
    # same `family="security"`, not by widening this one's claims again.
    description: "Presence of three security-hygiene artifacts: a security policy (SECURITY.md), a CI configuration, and a license. File presence only -- this does not scan code, detect secrets, or check CVEs. For GitHub's actual security toggles see Security Features."
    resource_types: ["repo"]
    intent: assessment  # true scoring against criteria — unchanged
    perspectives: ["Security", "Steward"]
    annotation_types: ["RequestForActionAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: documentation_coverage
    name: "Documentation Coverage"
    # Description rewritten 2026-08-31. It previously claimed to "assess README
    # completeness... and inline comment coverage". Neither is measured: nothing
    # here reads a line of source, computes a ratio, or judges whether a README
    # is complete. Same defect as security_scan's, found in the same pass.
    #
    # The half worth stating explicitly is that `collection_present` reads
    # `project.collections` -- OUR pgvector collections -- so it reports what we
    # ingested, not what the project wrote. A well-documented repo we never
    # ingested scores low, and that is a fact about us. Kept separate in the
    # wording for the reason cii_badge keeps "unreachable" apart from
    # "not registered".
    description: "Which documentation signals are present: the doc collection types actually ingested for this repo (markdown, web docs, API reference, examples, PDFs, release notes) and which hygiene files exist (README, CHANGELOG, CONTRIBUTING, CODE_OF_CONDUCT, AUTHORS, CODEOWNERS), banded into a quality score from the count of signals found. Presence, not depth -- no file content is read, no ratio is computed, and the collection half reflects what has been ingested here rather than what the project published."
    resource_types: ["repo"]
    intent: assessment  # scores completeness against a checklist — unchanged
    perspectives: ["Steward", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: repo_classification
    name: "Repo Classification"
    description: "What the repo represents (library/application/middleware/tool/tutorial/samples/documentation), where its expected artifacts live, and whether architecture recovery is worth running."
    resource_types:
      - repo
    intent: discovery
    perspectives:
      - Steward
      - Data Expert
      - all
    annotation_types:
      - ClassificationAnnotation
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: license_classification
    name: "License Classification"
    description: "Classify the repo's SPDX license id into a risk tier (permissive/weak copyleft/strong copyleft/source-available/unknown)."
    resource_types: ["repo"]
    intent: discovery  # retagged from 'assessment' 2026-08-20: Discovery is derivation over already-collected data (zero new fetch), not where a survey happens to be launched from. All three of this tier's analyses declare requires_resources={} — they reason over project_stats/file inventory that Scouting already gathered, and exist to decide whether the expensive tiers are worth paying for. See CLAUDE.md rule 17.  # is this worth pursuing, given its usage restrictions?
    perspectives: ["Steward", "Security", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: interface_surface
    name: Interfaces & Published API
    description: "What can be talked to, and whether the contract is written down — from the file inventory, declared dependencies, and the distribution/deployment-evidence/code-marker/architecture-interface facts other steps already recorded, no fetch. Answers two catalog questions at once, because the second is a finding about the first. Three rungs, evidence strength kept explicit: 'declared' is a committed contract (openapi.yaml, .proto) OR a packaging-declared entry point ([project.scripts], package.json bin); 'implemented' is the code running as one with no higher rung available (e.g. a distribution's own __main__.py, or a route/handler/service-method registration repo_symbol_extraction recorded); 'implied' is a dependency name only (fastapi, grpcio) and NEVER counts as a published API. Where repo_symbol_extraction has not yet run for this repo, or its languages are outside marker coverage, the finding says could_not_check and why, rather than guessing implied — a statement about whether the capture has run for THIS repo, not a permanent pipeline limitation. Specs under vendored, generated, example or test trees are excluded — OpenLineage was otherwise reported as publishing a gRPC API on the strength of two Maven test fixtures."
    resource_types: ["repo"]
    intent: discovery
    perspectives: ["Architecture", "Consumer", "App/AI Builder", "Data Expert"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    target_shape: whole_resource_only

  - id: community_support
    name: Community Support
    description: "Is this supported by a community, or merely popular? Reports attention, participation and channels as SEPARATE dimensions and names the weakest, rather than averaging them. repository_health's community_score is dominated by stars and forks — measured on the real catalog, it scores docling_graph 100/100 with four contributors, and 22 of 59 repos have six or fewer. Responsiveness is reported as not established: issue and pull-request response times are not collected, and an open-issue count says nothing about whether anyone replies."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Community", "Consumer", "Steward", "Governance"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    target_shape: whole_resource_only

  - id: cve_scan
    name: Dependency Advisories (CVEs)
    description: "Queries OSV.dev for advisories against the dependencies the manifest parser already recorded. Reports coverage as prominently as the count: DECLARED dependencies only (transitive ones are invisible), and only those with a pinned, parseable version — a range like ^0.41.7 cannot be queried, and sending it anyway makes OSV return every advisory for the package regardless of version. A clean result means 'none of what we could check had an advisory', never 'this repo has no vulnerable dependencies'."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Security", "Steward", "Admin"]
    annotation_types: ["RequestForActionAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: minutes
    target_shape: whole_resource_only

  # ── The four GAP analyses (docs/gap-analyses-design.md), added 2026-09-01 ──
  #
  # Each states what it will NOT claim, because for this family the refusal is
  # the design: a confident wrong answer about secrets or telemetry is worse
  # than no answer, and OpenSSF Scorecard's own habit of scoring a check it
  # could not evaluate is the failure being avoided.
  - id: secret_scan
    name: Committed Secrets
    description: "Scans HEAD content for committed-credential patterns using a VENDORED gitleaks ruleset (222 rules, MIT-licensed, source commit and pull date recorded). Reports WHICH ruleset and version produced the result, and surfaces the ruleset's own age — a stale ruleset misses key formats that did not exist when it was written and returns a confident clean. Never claims 'no secrets': only 'no matches against this ruleset, in the current HEAD snapshot of tracked files'. Says nothing about git history, which is where a removed secret still lives. Ruleset: https://github.com/gitleaks/gitleaks (MIT) — rules at https://github.com/gitleaks/gitleaks/blob/master/cmd/generate/config/rules"
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Security", "Steward", "Admin"]
    annotation_types: ["ClassificationAnnotation", "RequestForActionAnnotation"]
    source: local
    run_time: minutes
    target_shape: whole_resource_only

  - id: telemetry_scan
    name: Telemetry and Phone-Home
    description: "Looks for telemetry SDK imports and literal outbound endpoints in source, paired with whether the project DISCLOSES them — an undisclosed call is the finding, not the call itself. Deliberately conservative in the opposite direction from secret scanning: an ordinary API client is not telemetry, and labelling one as such would make the analysis untrustworthy in the direction that matters. Never claims a repo does not phone home; only that curated patterns did not match what was scanned."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Security", "Steward", "Admin"]
    annotation_types: ["ClassificationAnnotation", "RequestForActionAnnotation"]
    source: local
    run_time: minutes
    target_shape: whole_resource_only

  - id: contribution_provenance
    name: CLA / DCO Provenance
    description: "Keeps two questions apart that are usually conflated: whether contributor sign-off is STATED (CONTRIBUTING content mentions DCO or a CLA) and whether it is ENFORCED (a bot, workflow or branch protection actually blocks unsigned commits). Config presence alone reports `partial`, never `pass`. Note a disclosed limit: enforcement currently cannot be confirmed at all, because branch-protection data is not fetched anywhere in RE — that half reports UNVERIFIED rather than inventing a verdict."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Steward", "Community", "Admin"]
    annotation_types: ["ClassificationAnnotation", "RequestForActionAnnotation"]
    source: local
    run_time: fast
    target_shape: whole_resource_only

  - id: sla_content
    name: Published Support Commitments
    description: "Whether the project publishes support or service-level commitments. Deliberately NEUTRAL — present or absent, not pass or gap — because most repositories legitimately publish none, and grading their absence would manufacture a finding out of a normal state. Absence alone never raises an action, and a stated commitment is never assessed for whether it is honoured."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Steward", "Community", "Admin"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    target_shape: whole_resource_only

  - id: chaoss_metrics
    name: CHAOSS Metrics
    description: "CHAOSS community-health metrics over recorded commits, each reported on its own terms and never averaged into a score. Chiefly the elephant factor — the fewest contributors accounting for half the commits — which separates projects every other signal here rates the same: measured across the catalogue, deep_causality is 1 (one person wrote 98% of it) while kafka is 15. Organizational diversity is reported only where enough authorship is attributable; 72% of author emails in the catalogue are personal addresses with no employer in them."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Community", "Steward", "Governance", "Consumer"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    target_shape: whole_resource_only

  - id: cii_badge
    name: "OpenSSF Best Practices Badge"
    description: "The real OpenSSF Best Practices (CII) badge, read from bestpractices.dev rather than estimated. Reports the level together with the age of the self-assessment behind it: a badge level is a dated claim, and the level alone would carry the badge's authority with none of its age. Keeps three outcomes apart: badged, not registered (a fact about the project), and could not be looked up (a fact about us)."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Security", "Governance", "Steward", "Consumer"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    target_shape: whole_resource_only

  - id: refresh_plan
    name: "Refresh Plan"
    # A PLANNER (docs/survey-composition-and-topic-summary-design.md §2b) — the
    # mirror of a reducer: it reads stored STATE at the front of a survey rather
    # than stored findings at the end. `availability: queued` because it makes a
    # GitHub call for the head commit; `run_time: fast` because that is all it
    # does. ADVISORY: the survey executor runs every step in the graph
    # regardless, so this records the decision rather than enforcing it.
    description: "What a refresh would actually need to do, per target: which have never run, which are stale against the current head commit, and which are current. Judged per target rather than once for the whole survey, because 'unchanged' and 'complete' are different questions — a target that never ran needs work whatever the commit says. A head commit that cannot be read is reported as unknown, never as unchanged."
    resource_types: ["repo"]
    # `analysis`, not `automate`, and the distinction is the point. `automate`
    # deliberately has ZERO catalog entries (CLAUDE.md rule 17) — it is served by
    # automate.py's own subscriptions table, not by analyses. What lives in
    # Automate is the *survey* (survey_kind `refresh`, which the Automate tab
    # lists); the analysis itself is tagged for the tier its work belongs to,
    # alongside `manifest_parse` and `rag_ingestion`, which are the things it
    # plans. Tagging it `automate` broke that invariant and its test caught it.
    intent: analysis
    perspectives: ["Steward", "Admin"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: queued
    action: survey
    target_shape: whole_resource_only
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: security_summary
    name: "Security Summary"
    # A REDUCER (docs/survey-composition-and-topic-summary-design.md §2): it
    # measures nothing itself and reads what the other security steps wrote, so
    # it must run LAST in any survey containing them. `availability: queued`
    # despite being trivially fast — a compiler running this inline would
    # summarise whatever happened to be stored at that instant, which is the
    # "packer must never trigger a survey" rule seen from the other side.
    description: "One security verdict reduced from the other security analyses, with the two things a verdict usually loses: how many of its inputs actually ran, and the age of the oldest result it rests on. Summarises the latest sighting of each input rather than one survey run, so its own timestamp is newer than some of its evidence. Refuses to give a verdict at all below four inputs — a grade over three of eight would be a judgement about absence, not about the repository."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Security", "Steward", "Governance"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: queued
    action: survey
    target_shape: whole_resource_only
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: foss_scorecard
    name: FOSS Scorecard
    description: "OpenSSF-Scorecard-shaped checks computed from data already collected — maintenance, license, CI tests, releases, contributors, SAST settings. A check that cannot be evaluated reports unknown and is EXCLUDED from the score, rather than scored zero as OpenSSF's own tool does, and the coverage is reported alongside the number: 8.0 over five checks and 8.0 over twelve are different claims. Not comparable with a published OpenSSF score, by design."
    resource_types: ["repo"]
    intent: assessment
    perspectives: ["Security", "Steward", "Governance", "Consumer"]
    annotation_types: ["QualityScoreAnnotation"]
    source: local
    run_time: fast
    availability: inline
    target_shape: whole_resource_only

  - id: security_features
    name: "Security Features"
    description: "GitHub's native security feature toggles (Dependabot, secret scanning, advanced security) — configuration state, not artifact presence."
    resource_types: ["repo"]
    intent: assessment  # true scoring against criteria — same family as security_scan
    perspectives: ["Security", "Steward"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: ci_quality
    name: "CI Quality"
    description: "Whether CI workflows actually run tests/lint/build (keyword scan of workflow content), not just whether a CI config file exists."
    resource_types: ["repo"]
    intent: assessment  # true scoring against criteria — same family as security_scan
    perspectives: ["Steward", "Security", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: maturity
    name: "Maturity"
    description: "Project age/lifecycle stage (nascent/emerging/established/mature) from repo creation date — a CHAOSS-informed early-headlights signal, distinct from Repository Health's activity/community/release scoring."
    resource_types: ["repo"]
    intent: discovery  # retagged from 'assessment' 2026-08-20 — see CLAUDE.md rule 17.
    perspectives: ["Steward", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: dependency_support
    name: "Dependency Support"
    description: "Which curated technologies the dependency list indicates (psycopg2 -> PostgreSQL, kafka-python -> Apache Kafka) and whether Egeria already holds a technology type for each. A STARTING POINT for people, not an answer: a match says the repo indicates X, not that X is supported, and an unmatched dependency has simply not been classified yet. Mapping in configdata/dependency_support.yaml, shaped to seed an Egeria Supported Technologies collection (project owner, 2026-09-12: 'A now, shaped to seed B')."
    resource_types: ["repo"]
    intent: discovery  # reasons over project_dependencies (repo_manifest_parse's output) — zero repo fetch; the Egeria call is catalog consultation, not acquisition
    perspectives: ["Architecture", "Security", "Admin", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: deployment_evidence
    name: "Deployment Evidence"
    description: "Per declared distribution (repo_manifest_parse's output): which deployment evidence exists — a console entry point, a __main__.py, an unambiguous Dockerfile/compose/Helm chart, a web-framework dependency — and the verdict it supports: application (evidence found), library (importable, none found), or unknown (no manifest read yet). Layer 1 of 'Cataloguing in layers' (project owner, 2026-09-14): the evidence a Curate proposal's SoftwareCapability/Application verdict rests on, replacing a SoftwareLibrary-per-package guess."
    resource_types: ["repo"]
    intent: discovery  # reasons over already-parsed distribution/repo_conventions/dependency/file-inventory rows — zero repo fetch
    perspectives: ["Architecture", "Admin", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: egeria_interfaces
    name: "Egeria Interfaces Consumed"
    description: "Which Egeria view services this repository consumes — one per pyegeria client class its code symbols reference (signature/return-type/base-class text match against configdata/egeria_view_services.yaml; imports are not captured anywhere in this codebase, so this is a LOWER BOUND, not a count), plus Dr.Egeria doc-path evidence and a best-effort command-family guess from filenames (real family names live in markdown headings, which are not stored — marked could_not_check). A repo with no pyegeria dependency reads nothing_found, not never-run."
    resource_types: ["repo"]
    intent: discovery  # reasons over already-collected dependency/code-symbol/relationship/file-inventory rows — zero repo fetch; the mapping is a curated local table, no Egeria call
    perspectives: ["Architecture", "Admin", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: repo_conventions
    name: "Repo Conventions"
    description: "Discovery-tier repo conventions: security policy content, build automation, deployment/Docker evidence, catalog self-description (Backstage-style catalog-info.yaml), documentation breadth."
    resource_types: ["repo"]
    intent: discovery  # retagged from 'assessment' 2026-08-20 — see CLAUDE.md rule 17.
    perspectives: ["Steward", "Security", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: data_file_profiling
    name: "Data File Profiling"
    # Reworded 2026-08-31 alongside a real fix. The old text promised "schema,
    # row counts, and null statistics" flatly, and the columnar path was
    # emitting null_pct: 0.0 without measuring anything -- an unmeasured value
    # rendered as a confident measurement. Now null_pct is None there and the
    # description says which formats get which.
    description: "Profile tabular data files found in the file inventory. CSV, TSV and Excel are read to give schema, row counts and null rates. Parquet, Feather and Arrow are read from file metadata instead: schema and row count, but no null rates, which metadata does not carry. Files over 50 MB in the text formats are reported as too large rather than profiled — so a missing null rate means not applicable, too large, or never run, and these are kept apart rather than shown as zero."
