        calibrated: false
      scope: field

  - id: nested_column_profile
    name: "Nested Column Profile"
    description: "What is inside the JSON/JSONB/XML columns — keys, nesting, types, and consistency across rows. Samples each JSONB/JSON/XML column with the same §5.8 configuration surface postgres_column_profile uses, then infers a nested schema: per-key presence frequency and JSON-type consistency (or, for XML, root-element and element/attribute name frequency), and nesting depth. Produces a SchemaAnalysisAnnotation per column — including for a column where every sampled value is a JSON scalar or unparseable XML, which is a real, distinct finding (possibly a misclassified column), never rendered as 'no nested structure' (design §5.4; postgres_nested_columns, Phase 1 slice 11, gated on slice 10's sampling infrastructure)."
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Data Expert", "App/AI Builder"]
    annotation_types: ["ResourceMeasureAnnotation", "SchemaAnalysisAnnotation"]
    source: local
    # api_heavy per design §5.7 — reads actual JSON/XML values, same cost
    # class as postgres_column_profile and for the identical reason
    # (CLAUDE.md rule 17's availability-is-not-run_time ruling).
    run_time: medium
    availability: queued
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: list
      listing:
        item_fields: [column, family, label]
        order: 'structured first, then by name'
        key_field: column
        item_label: columns
      measures:
      - name: nested_columns
        unit: columns
        as_of: run.surveyed_at
        value_field: nested_columns.columns[]
        annotation:
          type: SchemaAnalysisAnnotation
      absence:
        not_measured: 'Not collected: no JSON, JSONB or XML value was sampled from this column.'
        not_permitted: 'Not permitted: the credential cannot read this column''s values.'
        not_applicable: 'Not applicable: the engine does not support sampling this column''s values.'
        measured_nothing: 'Measured: every sampled value is a scalar — a finding (possibly a misclassified column),
          not "no nested structure".'
      extents:
      - name: columns
        fields: [column, family, label, schema.max_depth, schema.keys]
        rows: 15
        order: structured first, then by name
        truncation: '{shown} of {total} nested columns shown, structured first'
        token_cost: 640
        citation: '{analysis} · {scope} · as of {as_of}'
      confidence:
        form: estimated
        basis: nested_columns.columns.schema.sample_size
        method: 'a sample of the rows, not every row'
      scope: field

