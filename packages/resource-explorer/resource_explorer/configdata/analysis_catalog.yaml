  - id: preliminary_fit
    name: "Preliminary Fit"
    description: >
      Could this be in scope for what I am looking for — worth the full pass?
      The Discovery gate of design §16.3: a zero-fetch comparison of the three
      free estimates (subject_signals, coverage_signals, grain_determination's
      time grain) against a supplied data requirement. Four verdicts, kept
      distinct on purpose: fits, does not fit, COULD NOT CHECK (an input was
      itself not established — the pg_stats/ANALYZE case, which must never
      read as either of the first two), and "no requirement declared" when no
      lens is supplied, which carries what this resource COULD satisfy instead
      of a vacuous pass. Regions, data classes and grain statements are
      carried through as deferred criteria naming the analysis that answers
      them, never scored here.
    resource_types: ["database"]
    # Retagged discovery -> enrichment, 2026-09-29 (ENRICHMENT-E1-CONTEXT-TAB,
    # project owner's amendment to the designer's reply §0.2): the reply said
    # no analysis runs at Enrichment; the owner's correction is that a class
    # does, when its prerequisite is a human input rather than a survey read.
    # This is that case — it already took a `lens` as a runtime parameter
    # (`db_derived.compute_preliminary_fit`), and a declared lens is exactly
    # the human input this class is gated on. Discovery's own zero-fetch tier
    # is unaffected: `test_discovery_is_the_zero_fetch_derivation_tier`
    # iterates repo analyses only, and this entry is database-only.
    intent: enrichment
    requires_input: lens
    perspectives: ["Consumer", "Financial"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: finding
      finding:
        what_field: verdict
      measures:
      - name: fit_confidence
        unit: confidence points (0-100, a rule score)
        as_of: run.read_snapshot
        value_field: confidence
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Could not check: none of the free estimates (subject, coverage, grain) is established yet — not
          a pass and not a failure.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the stored rows the
          free estimates come from, so it is not measured.'
        not_applicable: 'No requirement declared: without a lens there is nothing to fit against — not a pass and not
          a failure; what this resource could satisfy is shown instead.'
        measured_nothing: 'Measured: every criterion of the lens was checked and none failed.'
      extents:
      - name: verdict
        fields: [verdict, confidence, failed_inputs, unchecked_inputs, deferred_criteria]
        rows: 1
        order: the verdict
        truncation: '{shown} of {total} verdicts shown'
        token_cost: 80
        citation: '{analysis} · {scope} · as of {as_of}'
        source: ['.']
      confidence:
        form: inferred
        basis: inputs
        method: 'which of the three free estimates were available to compare'
        score: confidence
        calibrated: false
      scope: resource

