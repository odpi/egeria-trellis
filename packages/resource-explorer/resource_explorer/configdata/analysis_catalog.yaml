  # ── db_derived: the zero-fetch derivation tier (Phase 1 slice 9) ─────────
  #
  # All six are backed by the ONE `db_derived` step (design §5.7), which
  # reads only rows RE already stored and opens no connection — to the
  # database or to Egeria. `run_time: fast` and `availability: inline` follow
  # from that: there is no acquisition to pay for, which is exactly the
  # property CLAUDE.md rule 17 wants of the Discovery tier.
  - id: db_classification
    name: "Database Classification"
    description: >
      What kind of database this is — transactional, analytical, reference
      data, staging or a copy — derived from stored table shapes, key/FK
      density, naming patterns and the read/write mix in stored tuple
      counters. Reports a confidence scaled to how many signal families were
      actually available; a missing family (no tuple counters because ANALYZE
      never ran, no comparable database to fingerprint against) lowers
      confidence rather than counting as evidence, and too little signal
      renders as "not established" instead of naming a kind.
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Architecture", "Data Expert"]
    annotation_types: ["ClassificationAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: db_relationship_graph
    name: "Relationship Graph"
    description: >
      Is there a data model here — do the tables relate through foreign keys,
      or is it a bag of tables? Builds the FK graph from stored column rows:
      edge count, connected components, isolated tables, most-referenced
      tables. A survey that never captured key information renders as "not
      established" rather than as "no foreign keys".
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Architecture", "Data Expert"]
    annotation_types: ["SchemaAnalysisAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: db_hub_tables
    name: "Starting Tables"
    description: >
      Which tables would a consumer start with? A short ranking over four
      signals already stored for the other zero-fetch checks: how many other
      tables reference the table by foreign key, its row count, whether it
      carries a comment, and its read counters. No connection is opened. A
      signal that was never established for a table (keys not captured, no
      row count, statistics never collected) is left out of the ranking and
      named, never scored as zero — "no foreign keys captured" is not "nothing
      depends on this table".
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Consumer", "App/AI Builder", "Data Expert"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: db_statistics_freshness
    name: "Statistics Freshness"
    description: >
      Are this database's planner statistics current? Per table: never
      analyzed, last analyzed N days ago, and the rows changed since that
      analyze as a share of live rows, flagged when above the point at which
      Postgres's autovacuum would itself analyze the table
      (autovacuum_analyze_threshold 50 + autovacuum_analyze_scale_factor 0.1
      times the row estimate), with a per-schema roll-up. Reads only the
      stored table-activity and table rows; no connection is opened. This
      database's own autovacuum settings are not stored, so Postgres's
      defaults are used and the result says so. "Never analyzed" is Postgres's
      own NULL and is a finding; a table whose statistics could not be read is
      "not read" and is never counted as current or as never analyzed.
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Steward", "Admin", "Data Expert"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: grain_determination
    name: "Table Grain"
    description: >
      What is the grain of each table — one row per what? Derived from the
      declared primary key, or failing that from a stored column profile
      whose distinct count matches the row count, plus any date column in the
      key for the interval. Produces a DataGrainAnnotation carrying a
      grainStatement and a confidence that reflects the basis, published as a
      proposal (contentStatus DRAFT) because no DataGrain element exists yet.
      A table with no key and no profile is "not established"; a table with a
      profile and no unique column is a real modelling gap.
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Data Expert", "Steward"]
    annotation_types: ["DataGrainAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: db_fingerprint
    name: "Schema Fingerprint"
    description: >
      Does this look like a copy or subset of a database we already know? A
      structural signature over stored table and column names and types,
      hashed, and compared against every other database in the registry that
      has stored schema rows — by Jaccard similarity and by containment, so a
      genuine subset is detected as well as a duplicate. A registry with
      nothing comparable renders as "not established", not as "unique".
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Architecture", "Financial"]
    annotation_types: ["FingerprintAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

