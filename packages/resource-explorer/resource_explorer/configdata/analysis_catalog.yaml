    name: "Data Class Match"
    description: "Which columns conform to a known Egeria Data Class (PII and otherwise), with what confidence — and which look like a class we do not have yet. Matches column name, type and bounded value sampling against every DataClass in the platform, producing a DataClassAnnotation per column. An unmatched-but-patterned column is proposed as a new DataClass with contentStatus: DRAFT, linked to its evidence via AssociatedAnnotation (design §5.4; support doc §3 as settled by the corrected probe 4). Every confidence is stated against the sample that produced it, never as an unqualified \"conforms\" (design §5.8). A column no value was sampled from is not_established, never \"no match found\"."
