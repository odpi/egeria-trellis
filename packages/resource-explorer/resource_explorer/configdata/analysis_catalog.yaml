    # `_persist_diagram` ran INSIDE those two steps; that stopped being true
    # when the diagram moved to read-time rendering earlier the same day.
    intent: analysis
    perspectives: ["Architecture", "Consumer"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: queued
    action: survey
    target_shape: whole_resource_only
