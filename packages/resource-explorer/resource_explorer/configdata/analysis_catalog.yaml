  - id: reference_data_match
    name: "Reference Data Match"
    description: "Which low-cardinality columns conform to a known Egeria ValidValueSet, and which should become one. Columns whose n_distinct (from the stored pg_stats profile, sign convention resolved) falls under the reference-data gate have their sampled distinct values compared against every set in the platform: a full match becomes ValidValuesAssignment advice, a partial match raises an RFA listing the values outside the set, and no match at all proposes a new set with contentStatus: DRAFT (design §5.4). A truncated distinct-value list is inconclusive rather than a partial match, since a coverage fraction from an incomplete list is wrong in an unknown direction."
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Steward", "Data Expert", "Governance"]
    annotation_types: ["RelationshipAnnotation", "ResourceMeasureAnnotation", "RequestForActionAnnotation"]
    source: local
    run_time: medium
    availability: queued
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: proposal
      proposal:
        candidate_field: matched_display_name
        decided_by: curator
      measures:
      - name: established_columns
        unit: columns
        as_of: surveyed_at
        value_field: established_count
        basis:
          denominator_field: column_count
          denominator_label: columns
        annotation:
          type: RelationshipAnnotation
      - name: columns_examined
        unit: columns
        as_of: surveyed_at
        value_field: column_count
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Inconclusive: the distinct-value list was truncated or not sampled, so coverage of a set is not
          known — never a partial match.'
        not_permitted: 'Not permitted: the credential cannot read this column''s values.'
        not_applicable: 'Not applicable: the column has too many distinct values to be reference data.'
        measured_nothing: 'Measured: the column''s values match no valid-value set in the platform.'
