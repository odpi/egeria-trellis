    name: "Schema Conventions"
    description: >
      Check-granular structural hygiene derived from stored rows: tables with
      no primary key, tables with no foreign key, tables and columns with no
      comment, and names that are not lower snake_case. Does NOT cover unused
      indexes — postgres_schema_and_stats owns that check, which needs a live
      pg_stat_user_indexes read. A database where nothing at all is documented
      reads as "comments not captured" rather than as 100% undocumented.
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Steward", "Data Expert"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
