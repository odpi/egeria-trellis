# in that request, not through the queue, so availability says inline. It answers no catalog question yet.
open_data_analyses:
  - id: external_data_scout
    name: "External Data Scout"
    description: "Re-reads every dataset of a work list of open data from its portal (one call each, priced first) and refreshes what the portal states: license and its flags, publisher, modified date, formats, size, and the coverage and update cadence it gives. A portal that does not answer leaves the dataset's earlier values in place and says so; a field the portal does not state is reported as not reported by that source, never as empty."
