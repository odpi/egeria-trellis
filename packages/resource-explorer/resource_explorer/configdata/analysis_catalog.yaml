  # ── db_derived: the zero-fetch derivation tier (Phase 1 slice 9) ─────────
  #
  # All six are backed by the ONE `db_derived` step (design §5.7), which
  # reads only rows RE already stored and opens no connection — to the
  # database or to Egeria. `run_time: fast` and `availability: inline` follow
  # from that: there is no acquisition to pay for, which is exactly the
  # property CLAUDE.md rule 17 wants of the Discovery tier.
  - id: db_classification
    name: "Database Classification"
    description: >
      What kind of database this is — transactional, analytical, reference
      data, staging or a copy — derived from stored table shapes, key/FK
      density, naming patterns and the read/write mix in stored tuple
      counters. Reports a confidence scaled to how many signal families were
      actually available; a missing family (no tuple counters because ANALYZE
      never ran, no comparable database to fingerprint against) lowers
      confidence rather than counting as evidence, and too little signal
      renders as "not established" instead of naming a kind.
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Architecture", "Data Expert"]
    annotation_types: ["ClassificationAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: proposal
      proposal:
        candidate_field: kind
        decided_by: curator
      measures:
      - name: kind_confidence
        unit: confidence points (0-95, a rule score)
        as_of: run.read_snapshot
        value_field: confidence
        annotation:
          type: ClassificationAnnotation
      - name: signal_coverage
        unit: fraction of signal weight available (0-1)
        as_of: run.read_snapshot
        value_field: coverage
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not established: too little signal to name a kind — not a finding that the database is of no
          particular kind.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the table shapes or
          tuple counters the classification weighs, so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Undecided: the kinds scored too close to call, so none is proposed.'
      extents:
      - name: proposed_kind
        fields: [kind, confidence, ranked, signals_used, signals_missing, coverage]
        rows: 1
        order: the proposed kind
        truncation: '{shown} of {total} classifications shown'
        token_cost: 88
        citation: '{analysis} · {scope} · as of {as_of}'
        source: ['.']
      confidence:
        form: inferred
        basis: signals_used
        method: 'how many kinds of evidence were available: table shapes, key density, names, read/write activity'
        score: confidence
        calibrated: false
      scope: resource

  - id: db_relationship_graph
    name: "Relationship Graph"
    description: >
      Is there a data model here — do the tables relate through foreign keys,
      or is it a bag of tables? Builds the FK graph from stored column rows:
      edge count, connected components, isolated tables, most-referenced
      tables. A survey that never captured key information renders as "not
      established" rather than as "no foreign keys".
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Architecture", "Data Expert"]
    annotation_types: ["SchemaAnalysisAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: graph
      categories:
        exclusive: true
      measures:
      - name: foreign_key_edges
        unit: foreign-key edges
        as_of: run.read_snapshot
        value_field: edge_count
        annotation:
          type: SchemaAnalysisAnnotation
      - name: connected_components
        unit: connected components
        as_of: run.read_snapshot
        value_field: component_count
        annotation:
          type: ResourceMeasureAnnotation
      - name: largest_component
        unit: tables
        as_of: run.read_snapshot
        value_field: largest_component
        annotation:
          type: ResourceMeasureAnnotation
      - name: isolated_tables
        unit: tables
        as_of: run.read_snapshot
        value_field: isolated_tables[]
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not established: foreign keys were not captured for this database — not a finding that its tables
          do not relate.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the key constraints,
          so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: no table references another by foreign key — a bag of tables, a real finding.'
      extents:
      - name: graph_summary
        fields: [verdict, table_count, edge_count, component_count, largest_component]
        rows: 1
        order: the database as a whole
        truncation: '{shown} of {total} summaries shown'
        token_cost: 80
        citation: '{analysis} · {scope} · as of {as_of}'
        source: ['.']
      - name: most_referenced
        fields: [table, referenced_by]
        rows: 10
        order: by tables referencing it, most first
        truncation: '{shown} of {total} referenced tables shown, by tables referencing them'
        token_cost: 200
        citation: '{analysis} · {scope} · as of {as_of}'
      confidence:
        form: measured
      scope: resource

  - id: db_hub_tables
    name: "Starting Tables"
    description: >
      Which tables would a consumer start with? A short ranking over four
      signals already stored for the other zero-fetch checks: how many other
      tables reference the table by foreign key, its row count, whether it
      carries a comment, and its read counters. No connection is opened. A
      signal that was never established for a table (keys not captured, no
      row count, statistics never collected) is left out of the ranking and
      named, never scored as zero — "no foreign keys captured" is not "nothing
      depends on this table".
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Consumer", "App/AI Builder", "Data Expert"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: list
      listing:
        item_fields: [table, score, fk_in_degree, row_count]
        order: 'highest score first'
        key_field: table
        item_label: starting tables
      measures:
      - name: ranked_tables
        unit: tables
        as_of: provenance.read_snapshot
        value_field: ranked_count
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not established: the tables cannot be compared yet — not a finding that none of them is a natural
          starting point.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the keys, row counts
          or read counters the ranking compares, so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: no table stands out as a starting point on the signals that were available.'
      extents:
      - name: starting_tables
        fields: [table, score, fk_in_degree, row_count, has_comment, reads]
        rows: 10
        sort: [score desc]
        truncation: '{shown} of {total} ranked tables shown, by rank score'
        token_cost: 520
        citation: '{analysis} · {scope} · as of {as_of}'
        source: [hubs]
      confidence:
        form: measured
      scope: resource

  - id: db_statistics_freshness
    name: "Statistics Freshness"
    description: >
      Are this database's planner statistics current? Per table: never
      analyzed, last analyzed N days ago, and the rows changed since that
      analyze as a share of live rows, flagged when above the point at which
      Postgres's autovacuum would itself analyze the table
      (autovacuum_analyze_threshold 50 + autovacuum_analyze_scale_factor 0.1
      times the row estimate), with a per-schema roll-up. Reads only the
      stored table-activity and table rows; no connection is opened. This
      database's own autovacuum settings are not stored, so Postgres's
      defaults are used and the result says so. "Never analyzed" is Postgres's
      own NULL and is a finding; a table whose statistics could not be read is
      "not read" and is never counted as current or as never analyzed.
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Steward", "Administration", "Data Expert"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: list
      listing:
        item_fields: [schema, table, status, days_since_analyze]
        order: 'stale first, then never analyzed, then not read'
        key_field: table
        item_label: tables needing attention
      measures:
      - name: stale_tables
        unit: tables
        as_of: as_of
        value_field: counts.stale
        annotation:
          type: ResourceMeasureAnnotation
      - name: never_analyzed_tables
        unit: tables
        as_of: as_of
        value_field: counts.never_analyzed
        annotation:
          type: ResourceMeasureAnnotation
      - name: current_tables
        unit: tables
        as_of: as_of
        value_field: counts.current
        annotation:
          type: ResourceMeasureAnnotation
      - name: statistics_not_read_tables
        unit: tables
        as_of: as_of
        value_field: counts.not_read
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not measured: no table statistics are stored for this database — not a finding that its statistics
          are current, nor that nothing was ever analyzed.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read pg_stat_user_tables,
          so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: every table''s statistics are current.'
      extents:
      - name: needs_attention
        fields: [schema, table, status, days_since_analyze, changes_since_analyze, threshold]
        rows: 20
        order: stale first, then never analyzed, then not read; most rows changed first
        truncation: '{shown} of {total} tables needing attention shown, stale first'
        token_cost: 1000
        citation: '{analysis} · {scope} · as of {as_of}'
        source: [attention]
      confidence:
        form: measured
      scope: resource

  - id: grain_determination
    name: "Table Grain"
    description: >
      What is the grain of each table — one row per what? Derived from the
      declared primary key, or failing that from a stored column profile
      whose distinct count matches the row count, plus any date column in the
      key for the interval. Produces a DataGrainAnnotation carrying a
      grainStatement and a confidence that reflects the basis, published as a
      proposal (contentStatus DRAFT) because no DataGrain element exists yet.
      A table with no key and no profile is "not established"; a table with a
      profile and no unique column is a real modelling gap.
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Data Expert", "Steward"]
    annotation_types: ["DataGrainAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: proposal
      proposal:
        candidate_field: grain_statement
        decided_by: curator
      measures:
      - name: determined_grains
        unit: tables
        as_of: run.read_snapshot
        value_field: determined_count
        annotation:
          type: DataGrainAnnotation
      - name: undetermined_grains
        unit: tables
        as_of: run.read_snapshot
        value_field: undetermined_count
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not established: the table has no declared key and no stored column profile, so its grain is
          not known.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the key constraints
          or column statistics the grain is derived from, so it is not measured.'
        not_applicable: 'Not applicable: a view has no grain of its own.'
        measured_nothing: 'Measured: no column, alone or in the key, is unique over the rows — a modelling gap, not
          missing evidence.'
      extents:
      - name: grains
        fields: [qualified_name, grain_statement, basis, confidence, label, interval]
        rows: 25
        order: in table order
        truncation: '{shown} of {total} tables'' grains shown'
        token_cost: 1240
        citation: '{analysis} · {scope} · as of {as_of}'
      confidence:
        form: inferred
        basis: basis
        method: "the table's primary key, or a column profile whose distinct count matches the row count"
        score: confidence
        calibrated: false
      scope: member

  - id: db_fingerprint
    name: "Schema Fingerprint"
    description: >
      Does this look like a copy or subset of a database we already know? A
      structural signature over stored table and column names and types,
      hashed, and compared against every other database in the registry that
      has stored schema rows — by Jaccard similarity and by containment, so a
      genuine subset is detected as well as a duplicate. A registry with
      nothing comparable renders as "not established", not as "unique".
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Architecture", "Financial"]
    annotation_types: ["FingerprintAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: list
      listing:
        item_fields: [slug, verdict, column_jaccard]
        order: 'most similar first'
        key_field: slug
        item_label: comparable databases
      measures:
      - name: best_similarity
        unit: Jaccard similarity of columns (0-1)
        as_of: run.read_snapshot
        value_field: best_similarity
        annotation:
          type: FingerprintAnnotation
      - name: comparable_databases
        unit: databases
        as_of: run.read_snapshot
        value_field: comparable_databases
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not established: no other database in the registry has stored schema rows to compare against
          — not a finding that this one is unique.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the table and column
          names, so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: no known database resembles this one.'
      extents:
      - name: matches
        fields: [slug, verdict, column_jaccard, table_jaccard, containment]
        rows: 5
        sort: [column_jaccard desc]
        truncation: '{shown} of {total} similar databases shown, by similarity'
        token_cost: 240
        citation: '{analysis} · {scope} · as of {as_of}'
      confidence:
        form: measured
      scope: resource

  - id: schema_conventions
    name: "Schema Conventions"
    description: >
      Check-granular structural hygiene derived from stored rows: tables with
      no primary key, tables with no foreign key, tables and columns with no
      comment, and names that are not lower snake_case. Does NOT cover unused
      indexes — postgres_schema_and_stats owns that check, which needs a live
      pg_stat_user_indexes read. A database where nothing at all is documented
      reads as "comments not captured" rather than as 100% undocumented.
    # W58 (2026-11-04): this analysis answers two Assessment questions that ask different things of it. Each names
    # the checks whose own sentences headline it; the shared sentence (every gap, or the clean pass) stays the
    # fallback for every other question (Q-0083 asks for all of them). Read by `_schema_conventions_headline`
    # (FactLayer picks `by_question` per question); a check the run did not produce reads "not measured on this run".
    headline_by_question:
      Q-0088: [tables_without_comment]                                  # documentation: the comment counts
      Q-0090: [tables_without_primary_key, tables_without_foreign_key]  # well-modelled: the key/constraint counts
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Steward", "Data Expert"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: finding
      finding:
        what_field: explanation
        where_field: item
      measures:
      - name: tables_without_primary_key
        unit: tables
        as_of: run.read_snapshot
        value_field: checks.tables_without_primary_key.count
        basis:
          denominator_field: checks.tables_without_primary_key.total
          denominator_label: tables
        annotation:
          type: ResourceMeasureAnnotation
      - name: tables_without_foreign_key
        unit: tables
        as_of: run.read_snapshot
        value_field: checks.tables_without_foreign_key.count
        basis:
          denominator_field: checks.tables_without_foreign_key.total
          denominator_label: tables
        annotation:
          type: ResourceMeasureAnnotation
      - name: tables_without_comment
        unit: tables
        as_of: run.read_snapshot
        value_field: checks.tables_without_comment.count
        basis:
          denominator_field: checks.tables_without_comment.total
          denominator_label: tables
        annotation:
          type: ResourceMeasureAnnotation
      - name: column_comment_coverage
        unit: fraction of columns with a comment (0-1)
        as_of: run.read_snapshot
        value_field: checks.column_comment_coverage.fraction
        annotation:
          type: ResourceMeasureAnnotation
      - name: names_not_snake_case
        unit: tables and columns
        as_of: run.read_snapshot
        value_field: checks.naming_convention.count
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not verified: keys or comments were not captured for this database — not a finding that they
          are missing.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the constraints or
          comments, so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: every table and column passes this check.'
      extents:
      - name: checks
        fields: [check, label, count, total, explanation]
        rows: 5
        order: in check order
        truncation: '{shown} of {total} checks shown'
        token_cost: 240
        citation: '{analysis} · {scope} · as of {as_of}'
      - name: offending_items
        fields: [check, item]
        rows: 30
        sort: [check asc, item asc]
        truncation: '{shown} of {total} offending tables and columns shown, by check'
        token_cost: 520
        citation: '{analysis} · {scope} · as of {as_of}'
        source: [checks.tables_without_comment.items, checks.naming_convention.items]
        tag: check
      confidence:
        form: measured
      scope: resource

  - id: data_class_match
    name: "Data Class Match"
    description: "Which columns conform to a known Egeria Data Class (PII and otherwise), with what confidence — and which look like a class we do not have yet. Matches column name, type and bounded value sampling against every DataClass in the platform, producing a DataClassAnnotation per column. An unmatched-but-patterned column is proposed as a new DataClass with contentStatus: DRAFT, linked to its evidence via AssociatedAnnotation (design §5.4; support doc §3 as settled by the corrected probe 4). Every confidence is stated against the sample that produced it, never as an unqualified \"conforms\" (design §5.8). A column no value was sampled from is not_established, never \"no match found\"."
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Privacy", "Steward", "Security"]
    annotation_types: ["DataClassAnnotation", "ResourceMeasureAnnotation", "RequestForActionAnnotation"]
    source: local
    # api_heavy per design §5.7 — the only step in the database family that
    # reads actual table data. `queued`, not inline, for the same reason
    # `architecture_recovery` is: cheap to compute once the sample is in hand,
    # and the sample itself is a real fetch (CLAUDE.md rule 17's
    # availability-is-not-run_time ruling).
    run_time: medium
    availability: queued
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: proposal
      proposal:
        candidate_field: matched_display_name
        decided_by: curator
      measures:
      - name: established_columns
        unit: columns
        as_of: surveyed_at
        value_field: established_count
        basis:
          denominator_field: column_count
          denominator_label: columns
        annotation:
          type: DataClassAnnotation
      - name: columns_examined
        unit: columns
        as_of: surveyed_at
        value_field: column_count
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not established: no value was sampled from this column — never "no match found".'
        not_permitted: 'Not permitted: the credential cannot read this table''s values, so the column was not sampled.'
        not_applicable: 'Not applicable: this column''s type holds no values a data class describes.'
        measured_nothing: 'Measured: the sampled values match no data class in the platform.'
      extents:
      - name: matches
        fields: [column_path, verdict, matched_display_name, confidence, privacy_relevant, statement]
        rows: 25
        order: privacy-relevant first, then by confidence
        truncation: '{shown} of {total} columns shown, privacy-relevant first'
        token_cost: 1240
        citation: '{analysis} · {scope} · as of {as_of}'
        source: [columns]
      confidence:
        form: inferred
        basis: columns.sample
        method: 'the sampled values of each column, compared with the known classes'
        score: confidence
        calibrated: false
      scope: field

  # DESIGN-VALUE-PROFILE-AND-QUALITY-CHECKS.md: value profile -> propose -> run.
  # The check catalogue is vendored data (configdata/quality/testgen/PROVENANCE.md);
  # the names shown are Resource Explorer's own, never the upstream product's.
  - id: value_profile
    name: "Value Profile"
    description: "Measured, not estimated: per-column record, value, distinct and null counts, empty and placeholder-text counts, and date bounds with future-dated counts, over the whole table (one aggregate query per table). No sampling: a table over the row ceiling or the statement timeout is reported as not profiled with the reason, a view or foreign table as not applicable, a table the credential cannot read as not permitted — never as zero."
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Steward", "Owner", "Administration"]
    annotation_types: ["ResourceProfileAnnotation", "ResourceMeasureAnnotation"]
    source: local
    # api_heavy: it reads every row of every table it profiles.
    run_time: medium
    availability: queued
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: table
      table:
        # B1 (DESIGN-B1-MEMBER-SCOPED-TABLE-RESULT-2026-11-02): one row per column, every column stored in
        # analysis_table_rows; the Value profile tab reads them through this declaration. The columns are the
        # native row's own names (database_value_profiles), so the typed read and the native read compare field
        # for field (evidence/B1-VALUE-PROFILE-EQUIVALENCE).
        key_fields: [schema, table, column]
        columns:
        - schema
        - table
        - column
        - {name: state, type: state, absence: 'not profiled', states: [measured, not_measured, not_permitted, not_applicable]}
        - {name: reason, type: text, absence: 'no reason recorded'}
        - {name: general_type, type: text, absence: 'type not recorded'}
        - {name: ran_as, type: text, absence: 'role not recorded'}
        - {name: frequency_state, type: text, absence: 'most common values not asked for'}
        - {name: record_ct, type: integer, absence: 'not counted'}
        - {name: value_ct, type: integer, absence: 'not counted'}
        - {name: distinct_value_ct, type: integer, absence: 'not counted'}
        - {name: null_value_ct, type: integer, absence: 'not counted'}
        - {name: zero_length_ct, type: integer, absence: 'not counted'}
        - {name: filled_value_ct, type: integer, absence: 'not counted'}
        - {name: min_date, type: text, absence: 'no date range'}
        - {name: max_date, type: text, absence: 'no date range'}
        - {name: future_date_ct, type: integer, absence: 'not counted'}
        - {name: before_20yr_date_ct, type: integer, absence: 'not counted'}
        - {name: before_5yr_date_ct, type: integer, absence: 'not counted'}
        - {name: date_days_present, type: integer, absence: 'not counted'}
        - {name: min_length, type: integer, absence: 'no lengths taken'}
        - {name: max_length, type: integer, absence: 'no lengths taken'}
        - {name: avg_length, type: number, absence: 'no lengths taken', unit: 'characters'}
        - {name: zero_value_ct, type: integer, absence: 'not counted'}
        - {name: min_value, type: number, absence: 'no number range', unit: 'in the column''s own unit'}
        - {name: max_value, type: number, absence: 'no number range', unit: 'in the column''s own unit'}
        - {name: avg_value, type: number, absence: 'not taken', unit: 'in the column''s own unit'}
        - {name: stdev_value, type: number, absence: 'not taken', unit: 'in the column''s own unit'}
        - {name: fractional_sum, type: text, absence: 'not taken'}
        - {name: sum_value, type: text, absence: 'not taken'}
        - {name: boolean_true_ct, type: integer, absence: 'not counted'}
        max_rows: 1000
        order: 'by schema, table and column name, as the registry sorts them'
        truncation: 'the first {shown} of {total} columns; every column is stored and the summary counts them
          all'
        summary: [profiled_columns, columns]
      result_kind_note: 'About thirty facts per column (records, values, distinct, nulls, empties, dates, lengths,
        ranges) for up to thousands of columns: not one measure across items, so not a distribution; a table of
        members.'
      measures:
      - name: profiled_columns
        unit: columns
        as_of: surveyed_at
        value_field: measured_count
        basis:
          denominator_field: column_count
          denominator_label: columns
        annotation:
          type: ResourceProfileAnnotation
      - name: columns
        unit: columns
        as_of: surveyed_at
        value_field: column_count
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not profiled: the table is over the row ceiling or the statement timeout — never zero.'
        not_permitted: 'Not permitted: the credential cannot read this table, so it was not profiled.'
        not_applicable: 'Not applicable: a view or foreign table is not profiled.'
        measured_nothing: 'Measured: the table holds no rows.'
      confidence:
        form: measured
      scope: field

  - id: quality_checks
    name: "Quality Checks"
    description: "Proposes data-quality checks from the value profile (completeness, uniqueness, past dates, minimum date, row-count range) for a person to accept or reject in Curate, then runs the accepted ones against the database. A check whose inputs were not measured, or whose measure is undefined (an empty table, a zero baseline), is reported as not evaluated with the reason, never as a pass."
    resource_types: ["database"]
    intent: analysis  # retagged from 'assessment' 2026-10-22 (Q-0096 and Q-0097 are Analysis questions: proposing and running checks is analysis, the verdict is Q-0090's; review §1.3).
    perspectives: ["Steward", "Owner"]
    # The proposal step leaves ONE RequestForAction ("review N proposed quality checks") or, with none proposed, ONE
    # ResourceMeasure; run_quality_checks leaves one QualityAnnotation per evaluated check (RE's
    # AnnotationType.QUALITY_SCORE, published as Egeria's QualityAnnotationProperties) (quality slice Q2).
    annotation_types: ["RequestForActionAnnotation", "ResourceMeasureAnnotation", "QualityScoreAnnotation"]
    source: local
    run_time: medium
    availability: queued
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: proposal
      proposal:
        candidate_field: check_key
        decided_by: curator
        state_field: state
      measures:
      - name: checks_failed
        unit: checks
        as_of: results_surveyed_at
        value_field: status_counts.fail
        annotation:
          type: QualityScoreAnnotation
      - name: checks_passed
        unit: checks
        as_of: results_surveyed_at
        value_field: status_counts.pass
        annotation:
          type: QualityScoreAnnotation
      - name: checks_proposed
        unit: checks
        as_of: proposals_surveyed_at
        value_field: proposal_state_counts.proposed
        annotation:
          type: RequestForActionAnnotation
      absence:
        not_measured: 'Not evaluated: the check''s inputs were not measured, or its measure is undefined (an empty table,
          a zero baseline) — never a pass.'
        not_permitted: 'Not permitted: the credential cannot read the table the check runs against.'
        not_applicable: 'Not applicable: no check of this kind applies to this column.'
        measured_nothing: 'Measured: no check was proposed from the value profile.'
      extents:
      - name: results
        fields: [check_key, test_type, status, measure, severity, reason]
        rows: 25
        order: failures first, then warnings, then by check
        truncation: '{shown} of {total} check results shown, failures first'
        token_cost: 1240
        citation: '{analysis} · {scope} · as of {as_of}'
      - name: proposals
        fields: [check_key, test_type, state, reason]
        rows: 25
        order: awaiting a verdict first
        truncation: '{shown} of {total} proposed checks shown, awaiting a verdict first'
        token_cost: 840
        citation: '{analysis} · {scope} · as of {as_of}'
      confidence:
        form: judged
        basis: proposals.state
        method: "a person's decision on each proposed check"
      scope: field

  - id: db_change_rates
    name: "Change Rates"
    description: >
      How is it changing — rows inserted/updated/deleted per table per
      period, size drift and schema churn — differenced between two stored
      survey snapshots. A database surveyed only once renders as
      "insufficient history", never as zero change. A table whose cumulative
      counters were reset between snapshots reports "counters reset, no rate
      available" rather than the negative delta the subtraction would give.
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Steward", "Administration", "Owner"]
    annotation_types: ["ResourceMeasureAnnotation", "SchemaAnalysisAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: list
      listing:
        item_fields: [qualified_name, change, per_day]
        order: 'most rows written per day first'
        key_field: qualified_name
        item_label: tables
      measures:
      - name: tables_active
        unit: tables
        as_of: to_surveyed_at
        value_field: tables_active
        annotation:
          type: ResourceMeasureAnnotation
      - name: tables_idle
        unit: tables
        as_of: to_surveyed_at
        value_field: tables_idle
        annotation:
          type: ResourceMeasureAnnotation
      - name: tables_without_a_rate
        unit: tables
        as_of: to_surveyed_at
        value_field: tables_without_a_rate
        annotation:
          type: ResourceMeasureAnnotation
      - name: interval
        unit: days
        as_of: to_surveyed_at
        value_field: interval_days
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Insufficient history: this database has been surveyed once, and a rate needs two snapshots —
          not a finding that nothing is changing.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the tuple counters,
          so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: no table was written to between the two snapshots — genuinely idle.'
      extents:
      - name: per_table
        fields: [qualified_name, change, deltas, per_day, row_count_delta]
        rows: 20
        order: by rows written per day, most first
        truncation: '{shown} of {total} tables shown, by rows written per day'
        token_cost: 840
        citation: '{analysis} · {scope} · as of {as_of}'
      confidence:
        form: measured
      scope: resource

  - id: schema_diff
    name: "Schema Diff (Columns)"
    description: >
      Column-level schema drift since the previous survey — columns added,
      dropped, or retyped — restricted to tables that exist in both
      snapshots (a whole table appearing or disappearing is
      `db_change_rates`'s schema-churn story, not this one's). A database
      surveyed only once renders as "insufficient history", never as zero
      change. Design §9.1's `schema_diff` comparator; this covers the
      column/constraint half, the table add/drop half is already covered by
      `db_change_rates`.
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Steward", "Administration"]
    annotation_types: ["SchemaAnalysisAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: list
      listing:
        item_fields: [change, qualified_name, old_type, new_type]
        order: 'added, then dropped, then retyped'
        key_field: qualified_name
        item_label: column changes
      measures:
      - name: columns_added
        unit: columns
        as_of: to_surveyed_at
        value_field: columns_added[]
        annotation:
          type: SchemaAnalysisAnnotation
      - name: columns_dropped
        unit: columns
        as_of: to_surveyed_at
        value_field: columns_dropped[]
        annotation:
          type: SchemaAnalysisAnnotation
      - name: columns_retyped
        unit: columns
        as_of: to_surveyed_at
        value_field: columns_retyped[]
        annotation:
          type: SchemaAnalysisAnnotation
      absence:
        not_measured: 'Insufficient history: this database has been surveyed once, and a diff needs two snapshots —
          not a finding that the schema is unchanged.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the column definitions,
          so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: no column was added, dropped or retyped between the two surveys.'
      extents:
      - name: column_changes
        fields: [change, qualified_name, old_type, new_type]
        rows: 30
        order: added, then dropped, then retyped; by name
        truncation: '{shown} of {total} column changes shown, by kind of change'
        token_cost: 1000
        citation: '{analysis} · {scope} · as of {as_of}'
        source: [columns_added, columns_dropped, columns_retyped]
        tag: change
      confidence:
        form: measured
      scope: resource

  - id: grant_change
    name: "Grant Change"
    description: >
      New grants (especially to PUBLIC) or revoked grants since the
      previous survey, differenced across the two most recent snapshots of
      `database_grants`. A database surveyed only once renders as
      "insufficient history", never as zero change. Design §9.1's
      `grant_change` comparator — the Privacy/Security preset's
      done-test case.
    resource_types: ["database"]
    intent: analysis
    perspectives: ["Security", "Administration"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: list
      listing:
        item_fields: [change, grant]
        order: 'PUBLIC grants first'
        key_field: grant
        item_label: grant changes
      measures:
      - name: grants_added
        unit: grants
        as_of: to_surveyed_at
        value_field: grants_added[]
        annotation:
          type: ResourceMeasureAnnotation
      - name: grants_revoked
        unit: grants
        as_of: to_surveyed_at
        value_field: grants_revoked[]
        annotation:
          type: ResourceMeasureAnnotation
      - name: public_grants_added
        unit: grants
        as_of: to_surveyed_at
        value_field: public_grants_added[]
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Insufficient history: grants have been read once, and a change needs two snapshots — not a finding
          that grants are unchanged.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the grants, so it is
          not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: no grant was added or revoked between the two surveys.'
      extents:
      - name: grant_changes
        fields: [change, grant]
        rows: 30
        order: PUBLIC grants first, then added, then revoked
        truncation: '{shown} of {total} grant changes shown, PUBLIC first'
        token_cost: 520
        citation: '{analysis} · {scope} · as of {as_of}'
        source: [grants_added, grants_revoked]
        tag: change
      confidence:
        form: measured
      scope: resource

  # ── §16's coverage/grain/fit rows (2026-09-24) ───────────────────────────
  #
  # `docs/multi-resource-questions-design.md` §16.3's Scouting and Discovery
  # rows. All three are backed by the same `db_derived` step as the six above,
  # for the same reason: they reason over already-stored rows and open no
  # connection. §16.3 files the first two under Scouting; they are tagged
  # `discovery` here because CLAUDE.md rule 17's axis is "does this collect, or
  # reason over what is already collected", and these reason — the same
  # judgement that already put `grain_determination` (also a Scouting row in
  # §16.3) in `discovery`. §16.2's "Scouting" is about when the SIGNAL is free,
  # and it is: no fetch is added anywhere.
  - id: subject_signals
    name: "Subject Signals"
    description: >
      What is this data about? Candidate subject terms from stored table and
      column names and from pg_description comments, each carrying the basis
      it came from — a comment outranks a name, and a term found in both
      outranks either. Confidence is deliberately low-medium (design §16.2:
      "a name is a claim"), and NOTHING is matched against Egeria's glossary
      or a data-class registry, because this step opens no connection: an
      unmatched term means "not looked up", never "not a known term". A
      database whose names are entirely structural (id, created_at, value)
      reads as a real finding pointing at Enrichment, not as a missing survey
      step; a database where not one table or column carries a comment reads
      as "comments not captured" rather than as undocumented.
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Consumer", "Data Expert", "Steward"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: proposal
      proposal:
        candidate_field: term
        decided_by: curator
      measures:
      - name: subject_terms
        unit: candidate terms
        as_of: run.read_snapshot
        value_field: term_count
        annotation:
          type: ResourceMeasureAnnotation
      absence:
        not_measured: 'Not established: no schema rows are stored for this database — not a finding that its data has
          no subject.'
        not_permitted: 'Not permitted: the credential that surveyed this database could not read the table and column
          names or comments, so it is not measured.'
        not_applicable: 'Not applicable: this analysis reads a database''s own tables, and this resource holds none
          to read.'
        measured_nothing: 'Measured: every name is structural (id, created_at, value), so nothing says what the data
          is about — a finding for Enrichment.'
      extents:
      - name: terms
        fields: [term, basis, confidence, occurrences]
        rows: 15
        order: by confidence, then occurrences, highest first
        truncation: '{shown} of {total} candidate terms shown, by confidence'
        token_cost: 520
        citation: '{analysis} · {scope} · as of {as_of}'
      confidence:
        form: inferred
        basis: terms.basis
        method: 'whether the term came from a comment, a name, or both'
        score: confidence
        calibrated: false
      scope: resource

  - id: coverage_signals
    name: "Coverage Signals"
    description: >
      What period and places does this appear to cover, from catalog
      statistics and names alone — no row read? The period comes from
      pg_stats histogram bounds (and exact min/max where a native survey
      stored them) on date and timestamp columns. Their ABSENCE means ANALYZE
      has not run, or the credential cannot see pg_stats — it does NOT mean
      the database holds no dates, and the two are separate named states
      (design §16.2's own warning). Places are the NAMES of place-bearing
      columns only: which regions are actually present needs the values, so
      it is deferred to coverage_profile rather than estimated. Partition
      bounds would be exact and free, and nothing in RE collects them yet, so
      that block reports a collection gap rather than silence.
    resource_types: ["database"]
    intent: discovery
    perspectives: ["Consumer", "Governance"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null
    declaration:
      result_kind: measure
      measures:
      - name: coverage_start
        unit: timestamp
        as_of: run.read_snapshot
        value_field: temporal.dataCoverageStartTime
        annotation:
          type: ResourceMeasureAnnotation
