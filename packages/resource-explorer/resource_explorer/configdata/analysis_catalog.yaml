    description: "Downloads the first three tabular distributions of each dataset on a work list of open data (each capped; a larger file is not read), profiles them with the same code as a file system's data-file profile, matches the sampled columns against the data classes Egeria holds, reads documentation distributions (data dictionary, codebook, citation, license, methodology) as evidence stated by that file, collects where the dataset came from, and fingerprints its columns against open data already profiled. A distribution over the cap is reported as not profiled, never as empty; a number carries its sample ratio and when it was retrieved."
