<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource Explorer · /next</title>
<link rel="icon" href="/static/egeria-logo.png">

<!-- Self-hosted, like every other asset this app loads. Regenerate with
     frontend-build/build-next-fonts.py. -->
<link rel="stylesheet" href="/static/next/fonts/fonts.css">

<style>
  /* Base and the handful of things a utility class is the wrong tool for.
     Kept ABOVE the Tailwind link on purpose — index.html learned the hard
     way that a plain class and a Tailwind utility of equal specificity are
     decided by source order (see frontend-build/README.md). */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #1b1a19;
    color: #f3f2f2;
    font-family: Lora, Georgia, serif;
    font-size: 15px;   /* raised from 14px with the answer line — see the
                          `answer` token's note in tailwind-next.config.js */
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* Tabular figures. Every span holding a COUNT gets this; running prose
     keeps its default figures. This is the change most likely to make the
     app look considered rather than restyled, and no codemod can find the
     spans — it is a manual pass, so the class is deliberately short. */
  .tnum { font-feature-settings: "tnum"; font-variant-numeric: tabular-nums; }

  /* Resizable table columns (next/colresize.js): a thin vertical bar at a header cell's right
     edge, drawn on hover, on keyboard focus and while dragging. currentColor, so it follows the
     theme; the cursor says what a drag does. */
  .rc-handle {
    position: absolute; top: 0; right: 0; bottom: 0; width: 7px;
    cursor: col-resize; touch-action: none; user-select: none;
  }
  .rc-handle::after {
    content: ""; position: absolute; top: 2px; bottom: 2px; right: 2px; width: 2px;
    background: currentColor; opacity: 0; border-radius: 1px;
  }
  *:hover > .rc-handle::after { opacity: 0.25; }
  .rc-handle:hover::after, .rc-handle:focus-visible::after, .rc-handle[data-rc-active]::after { opacity: 0.8; }
  .rc-handle:focus-visible { outline: none; }

  /* Never the browser default. */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid #b68235; outline-offset: 2px; }

  ::selection { background: rgba(182, 130, 53, 0.3); }

  /* The intent strip must never wrap: a wider item reflows the whole row.
     Scrolled horizontally instead, with the scrollbar out of the way. */
  .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* De-emphasis is glyph, weight and border style — never fading text
     toward the ground. Nothing in this file sets opacity on text, and this
     comment is here so the next person adding a "dim" role reads it first. */

  /* Hover is an accent tint, everywhere something is interactive. A tint
     rather than a colour change, so the element's own state (held, selected,
     current) still reads underneath it. */
  #app-grid button:hover, #intent-nav button:hover, #perspective-row button:hover {
    background-color: rgba(182, 130, 53, 0.12);
  }

  /* ── Responsive ───────────────────────────────────────────────────────
     Three columns collapse RAIL FIRST, then the sidebar — the content pane
     is the artefact and is the last thing to give up room. Both panels
     RESTACK rather than disappear: hiding the rail would take `evidence`
     with it, and hiding the sidebar would strand the selection. The content
     column is `minmax(0, 1fr)` at every width, or a long qualified name
     forces the whole page to scroll sideways. */
  /* The two seam widths are DRAGGABLE and PERSISTED (see app.js). They are
     not cosmetic: qualified names and file paths are this app's primary
     content, and a reader of answers and a reader of paths want different
     proportions. Defaults here, overridden by the stored values on load. */
  #app-grid {
    --sidebar-w: 240px;
    --rail-w: 290px;
    display: grid;
    grid-template-columns:
      minmax(150px, var(--sidebar-w)) minmax(0, 1fr) minmax(0, var(--rail-w));
    grid-template-areas: "sidebar content rail";
  }
  #app-grid > .pane-sidebar { grid-area: sidebar; }
  #app-grid > .pane-content { grid-area: content; }
  #app-grid > .pane-rail    { grid-area: rail; }

  /* A 5px grab strip sitting ON the seam, drawn only on hover/drag so the
     hairline stays a hairline. */
  .seam {
    position: absolute; top: 0; bottom: 0; width: 5px; z-index: 20;
    cursor: col-resize; background: transparent;
  }
  .seam:hover, .seam.dragging { background: rgba(182, 130, 53, 0.55); }
  #seam-sidebar { left: calc(var(--sidebar-w) - 2px); }
  #seam-rail    { right: calc(var(--rail-w) - 2px); }
  body.resizing { cursor: col-resize; user-select: none; }

  @media (max-width: 1100px) {
    #app-grid {
      grid-template-columns: minmax(150px, var(--sidebar-w)) minmax(0, 1fr);
      grid-template-areas: "sidebar content" "sidebar rail";
      grid-template-rows: minmax(0, 1fr) auto;
    }
    #app-grid > .pane-rail { border-left: 0; border-top: 1px solid #444141; }
    /* Only the sidebar seam still means anything once the rail is stacked. */
    #seam-rail { display: none; }
  }

  @media (max-width: 780px) {
    #app-grid {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "content" "rail" "sidebar";
      grid-template-rows: minmax(0, 1fr) auto auto;
    }
    #app-grid > .pane-sidebar { border-right: 0; border-top: 1px solid #444141; }
    .seam { display: none; }
  }

  /* ── The comparison matrix ──────────────────────────────────────────
     The checkbox and resource columns FREEZE while the question columns
     scroll under them. Without it, scrolling right on a laptop loses which
     row you are on — the one thing a comparison grid must never do — and at
     27 columns you are scrolling almost immediately. The scroll is confined
     to the table's own container, so the page itself never moves. */
  #wl-grid { overflow-x: auto; }
  #wl-grid table { border-collapse: separate; border-spacing: 0; }
  #wl-grid th, #wl-grid td { border-bottom: 1px solid var(--wl-rule, rgba(32,31,29,.16)); }
  #wl-grid .wl-freeze-1, #wl-grid .wl-freeze-2 {
    position: sticky; z-index: 2; background: #f3f2f2;
  }
  #wl-grid .wl-freeze-1 { left: 0; }
  #wl-grid .wl-freeze-2 { left: 26px; }
  /* A hairline where the frozen block ends, so the seam is legible rather
     than the columns appearing to overlap mid-scroll. */
  #wl-grid .wl-freeze-2 { box-shadow: 1px 0 0 rgba(32,31,29,.16); }
  #wl-grid thead th { position: sticky; top: 0; z-index: 3; background: #f3f2f2; }
  #wl-grid thead th.wl-freeze-1, #wl-grid thead th.wl-freeze-2 { z-index: 4; }
  /* Question columns stay narrow: they hold one glyph. */
  #wl-grid td.wl-cell, #wl-grid th.wl-col { width: 26px; min-width: 26px; text-align: center; }
  /* Every cell is a button — clicking it opens that question's latest
     results. It must LOOK clickable without gaining a border, which at 26px
     across 27 columns would read as a grid of boxes rather than a matrix. */
  #wl-grid .wl-cellbtn {
    display: block; width: 100%; cursor: pointer;
    background: none; border: 0; font: inherit; color: inherit;
    border-radius: 2px;
  }
  #wl-grid .wl-cellbtn:hover { background: rgba(32,31,29,.08); }
  /* AGE IS A RULE ON THE CELL'S BASELINE, graded, never a recolour.
     It does not compete with the glyph for the same pixels, it survives
     print, and a column of stale cells reads as a broken underline running
     down the grid — which an appended dot could never give you. */
  /* THE BUTTON FILLS THE CELL, so "full cell width" means what it says.
     Two measurements got this right, both on a faked 30-day date because
     nothing in the corpus is old enough to render it:
       - Drawn on the button while the CELL carried the padding, the button
         was 14px inside a 26px cell: "full width" was 54% of the cell, and
         the rules of adjacent stale cells never met — which is exactly the
         continuous broken underline down a column this channel exists for.
       - Moved to the `td` instead, the rule computed 1700px wide: a
         `position: relative` table cell did not establish the containing
         block, so `width: 100%` resolved against the table.
     So the padding moves to the button and the rule stays on the button.
     `:has()` keeps the padding on cells that hold a bare glyph rather than
     a button — those are not clickable and still need their box. */
  #wl-grid td.wl-cell:has(> .wl-cellbtn) { padding: 0; }
  #wl-grid .wl-cellbtn { position: relative; padding: 6px 0; }
  #wl-grid .wl-age1::after, #wl-grid .wl-age2::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 1px; background: var(--wl-age, rgba(32,31,29,.55));
  }
  #wl-grid .wl-age1::after { width: 40%; height: 1px; }
  #wl-grid .wl-age2::after { width: 100%; height: 2px; }

  /* The readout: a FIXED slot above the grid holding the question for
     whichever column was last touched — hover, keyboard focus, or an open
     cell. A tooltip shows one at a time, needs a mouse, times out, and covers
     the cells you are comparing. This does none of those, and gives keyboard
     users exactly what pointer users get. */
  #wl-readout { min-height: 1.6em; }

  /* The text-size steps. `html { font-size }` is what every rem-based size in
     the pane scales against; the chrome deliberately scales with it too, so
     one control moves the whole interface rather than leaving the shell at a
     size the content has outgrown. */
  html { font-size: 16px; }
  html[data-textsize="112"] { font-size: 17.9px; }
  html[data-textsize="125"] { font-size: 20px; }
  #textsize button[aria-pressed="true"] { color: var(--wl-accent-on-dark, #e0b872); }

  /* The chart selector, in the same language as the stage tabs: accent ink
     and an accent underline. Selection is the only thing on the pane that
     must never be inferred. */
  .wl-chartchip { border-bottom: 2px solid transparent; }
  .wl-chartchip[aria-pressed="true"] {
    color: var(--wl-accent-ink, #7d5411);
    border-bottom-color: var(--wl-accent, #b68235);
  }

  /* The same staleness treatment the grid uses, for a line of text: a rule
     under it, never a recolour. Age and quality stay different claims. */
  .wl-age-text { border-bottom: 1px solid var(--wl-age, rgba(32,31,29,.55)); }

  /* Dashboard cards. A PROSE measurement is a peer of a numeric one — same
     border, same weight, same rank in the flow — and simply wider, because a
     sentence needs a measure to be read at. A grid that can only hold numbers
     pushes the honest findings to the bottom of the page. */
  .wl-cards {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  }
  .wl-card-wide { grid-column: span 2; }
  @media (max-width: 780px) {
    .wl-cards { grid-template-columns: minmax(0, 1fr); }
    .wl-card-wide { grid-column: auto; }
  }
  #wl-grid th.wl-col-live { color: var(--wl-accent-ink, #7a6a3f); }
  #wl-grid .wl-cellbtn:focus-visible { outline: 2px solid var(--wl-focus, #7a6a3f); outline-offset: 1px; }

  /* ── The chat rail is a DRAWER, not a fixed column ──────────────────── */
  #app-grid.rail-closed {
    grid-template-columns: minmax(150px, var(--sidebar-w)) minmax(0, 1fr);
    grid-template-areas: "sidebar content";
  }
  #app-grid.rail-closed > .pane-rail { display: none; }
  #app-grid.rail-closed #seam-rail { display: none; }

  /* On a narrow viewport an open drawer OVERLAYS rather than squeezing the
     content pane — below ~1100px there is not enough width to give away. */
  @media (max-width: 1100px) {
    #app-grid:not(.rail-closed) > .pane-rail {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: min(360px, 92vw); z-index: 30;
      border-left: 1px solid #444141; border-top: 0;
      box-shadow: 0 12px 32px rgba(45, 43, 43, 0.22);
    }
    #app-grid:not(.rail-closed) {
      grid-template-columns: minmax(150px, var(--sidebar-w)) minmax(0, 1fr);
      grid-template-areas: "sidebar content";
      grid-template-rows: minmax(0, 1fr);
    }
  }

  /* ── Below 780px BOTH side panes are drawers ─────────────────────────────
     Stacking the sidebar under the content was fine in principle and wrong in
     practice: the rail's own overlay rule kept a sidebar COLUMN alive at
     375px, so the content pane was a squeezed strip with a drawer sitting on
     top of it. At this width there is no width to give away — content gets
     all of it, and either pane arrives over the top when asked for.

     This block is last on purpose. It must win over the rail rules above,
     which carry the same specificity. */
  @media (max-width: 780px) {
    /* All three forms, because `.rail-closed` and `:not(.rail-closed)` each
       out-specify a bare `#app-grid` — a media query adds no specificity, so
       the bare selector alone left a phantom 277px sidebar column and a 98px
       content pane. */
    #app-grid,
    #app-grid.rail-closed,
    #app-grid:not(.rail-closed) {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "content";
      grid-template-rows: minmax(0, 1fr);
    }
    #app-grid > .pane-sidebar {
      position: absolute; top: 0; left: 0; bottom: 0;
      width: min(300px, 88vw); z-index: 31;
      /* Its OWN ground. As a column the sidebar inherits the chrome behind
         it; as a drawer it floats over the paper content pane, and without
         this its chrome-light text lands on white and is invisible — the
         drawer opened correctly and looked like a blank screen. */
      background: #1b1a19;
      border-right: 1px solid #444141; border-top: 0;
      box-shadow: 0 12px 32px rgba(45, 43, 43, 0.28);
      transform: translateX(-101%); transition: transform .16s ease-out;
    }
    body.sidebar-open #app-grid > .pane-sidebar { transform: none; }
    #app-grid:not(.rail-closed) > .pane-rail {
      width: min(360px, 92vw);
    }
    .seam { display: none; }
  }
  /* The header is a two-line masthead on a phone, not a six-line one. The
     investigation name is context, and
     context is what a 375px screen has least room for — the content is why
     anyone opened it. */
  @media (max-width: 780px) {
    #investigation-name, #investigation-scope { display: none; }
    #intent-nav { overflow-x: auto; white-space: nowrap; }
    #perspective-row { max-height: 2.4em; overflow: hidden; }
  }

  /* The sidebar toggle exists only where the sidebar is a drawer. */
  #sidebar-toggle { display: none; }
  @media (max-width: 780px) { #sidebar-toggle { display: inline-block; } }
</style>

<link rel="stylesheet" href="/static/next/tailwind-next.css">
<script src="/static/auth.js"></script>
</head>

<body class="bg-chrome text-chrome-ink font-body">

<!-- ── Login overlay ──────────────────────────────────────────────────────
     Inline styles, and the element ids auth.js binds to. Deliberately
     depends on nothing but the token stylesheet: if the Tailwind build were
     missing this must still be usable, because it is the screen you would
     be looking at when you found out. auth.js toggles `style.display`
     directly, so this cannot become a class-based toggle. -->
<div id="login-overlay" style="display:none;position:fixed;inset:0;z-index:100;
     align-items:center;justify-content:center;background:#1b1a19">
  <div style="width:min(380px,92vw);border:1px solid #444141;border-radius:4px;
              padding:27.6px;background:#201f1d">
    <div style="font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;margin-bottom:4.6px">
      Resource Explorer
    </div>
    <div style="font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#e1ad66;
                margin-bottom:18.4px">Experimental UI</div>
    <div id="login-message" class="hidden" style="font-size:13px;color:#9b9797;margin-bottom:13.8px"></div>
    <label for="login-username" style="display:block;font-size:11.5px;color:#9b9797;margin-bottom:4.6px">
      Egeria user id
    </label>
    <input id="login-username" type="text" autocomplete="username"
           style="width:100%;padding:6px 10px;margin-bottom:13.8px;font:inherit;font-size:13px;
                  color:#f3f2f2;background:transparent;border:1px solid #444141;border-radius:2px">
    <label for="login-password" style="display:block;font-size:11.5px;color:#9b9797;margin-bottom:4.6px">
      Password
    </label>
    <input id="login-password" type="password" autocomplete="current-password"
           style="width:100%;padding:6px 10px;margin-bottom:13.8px;font:inherit;font-size:13px;
                  color:#f3f2f2;background:transparent;border:1px solid #444141;border-radius:2px">
    <div id="login-error" class="hidden" style="font-size:12px;color:#e1ad66;margin-bottom:9.2px"></div>
    <button id="login-submit-btn"
            style="font-family:'Cormorant Garamond',Georgia,serif;font-size:14px;cursor:pointer;
                   padding:6px 16px;color:#e1ad66;background:transparent;
                   border:1px solid #b68235;border-radius:2px">Sign in</button>
    <!-- Only useful in the dev-box anonymous-read mode, and safe by
         construction rather than by being hidden: Auth.hideLogin() refuses
         to dismiss while the server requires login and nobody is signed in,
         so this button cannot reveal a shell whose every call 401s. Without
         it, an anonymous-read box shows a modal with no way past it. -->
    <button id="login-dismiss-btn"
            style="margin-left:9.2px;font-size:12px;cursor:pointer;color:#9b9797;
                   background:transparent;border:0">Continue without signing in</button>
  </div>
</div>

<div class="flex h-full flex-col">

  <!-- ── Top bar ───────────────────────────────────────────────────────── -->
  <header class="relative flex flex-wrap items-center gap-s4 border-b border-chrome-line px-4 py-[10px]">
    <!-- Below 780px the sidebar is a drawer and this is the way in. It lives
         in the MASTHEAD, not in the nav row below: that row overflows
         horizontally at this width, which put the button at x=882 on a 375px
         screen — present, styled, and unreachable. -->
    <button id="sidebar-toggle" aria-expanded="false" title="Show the resource list"
      class="cursor-pointer bg-transparent text-accent-on-dark">Resources</button>
    <!-- THE APP'S OWN TEXT SIZE. An interface that lives inside an embedded
         browser cannot rely on the browser's zoom, and should not have to:
         one control removes the whole class of complaint. Three steps off the
         root font size, which every pane size is expressed against. -->
    <span id="textsize" class="flex items-baseline gap-[2px] text-[13px]" role="group"
          aria-label="Text size">
      <button data-textsize="100" class="cursor-pointer bg-transparent px-[5px] text-chrome-muted"
        title="Normal text size">A</button>
      <button data-textsize="112" class="cursor-pointer bg-transparent px-[5px] text-[15px] text-chrome-muted"
        title="Larger text">A</button>
      <button data-textsize="125" class="cursor-pointer bg-transparent px-[5px] text-[17px] text-chrome-muted"
        title="Largest text">A</button>
    </span>
    <span class="font-heading text-brand font-semibold">Resource Explorer</span>
    <!-- The resource's own menu (REPLY-DESIGNER-RESOURCE-CONTROLS-PLACEMENT.md
         §1): the name is bordered in the accent-deep colour, which is how a
         control looks, so it IS one. Hide/unhide and Remove live behind it
         because this is the one element that names the current resource on
         every stage and sub-tab. app.js renderTopBar() fills it and binds it. -->
    <button id="scope-slug" type="button" aria-haspopup="menu" aria-expanded="false"
            title="This resource's menu: hide, remove"
            class="cursor-pointer rounded-sm border border-accent-deep bg-transparent px-2 py-[2px] font-mono text-provenance text-accent-on-dark disabled:cursor-default"></button>
    <span class="ml-auto flex items-center gap-s4 text-[12px] text-chrome-muted">
      <button id="activity-open-btn" type="button" title="Recent activity — scouting, survey, publish, RFA"
        class="cursor-pointer bg-transparent text-chrome-muted hover:text-chrome-ink">📋 Activity
        <span id="activity-count" class="tnum text-accent-on-dark">–</span>
        <span id="activity-unread" class="tnum hidden rounded-sm border border-accent px-[5px] text-accent-on-dark"></span></button>
      <button id="admin-open-btn" type="button" title="System configuration — annotation types, question catalog, logs, feedback, Prefect, plus links to the rest in the current UI"
        class="cursor-pointer bg-transparent text-chrome-muted hover:text-chrome-ink">⚙ Admin</button>
      <span id="investigation-name">No investigation</span>
      <!-- RULING-NAV-GROUPING.md §3: "Investigation additionally becomes a
           scope control in the header row, showing the active investigation
           and whether it is ad hoc or bound to an Egeria Project. That
           binding deserves permanent visibility." This slice builds the
           permanent-visibility half — the badge below, driven by the
           investigation's own `egeria_binding`/`egeria_project_guid`, which
           already exist on the row (investigations.py). Turning this into an
           interactive control that itself switches or binds investigations
           is a larger change (that already lives, partially, as the
           sidebar's `#investigation-select` and the New Investigation form's
           binding step) and is deliberately NOT built here — see
           NAV-GROUPING-IMPLEMENTED.md for why it's deferred. -->
      <span id="investigation-scope" class="text-chrome-muted"></span>
      <button id="whoami" type="button" aria-haspopup="dialog" title="Connection details: who you are signed in as, which Egeria, which build"
        class="shrink-0 cursor-pointer whitespace-nowrap border-0 bg-transparent p-0 text-chrome-muted underline decoration-dotted hover:text-chrome-ink">–</button>
      <!-- Make switching one click, and say which UI you are in. Testers
           comparing one repo in both shells in one session is what produces
           usable feedback. -->
      <a id="switch-ui" href="/classic"
         class="rounded-sm border border-chrome-line px-2 py-[2px] text-chrome-ink no-underline hover:border-accent hover:text-accent-on-dark">
        Classic
      </a>
      <button id="logout-btn" class="cursor-pointer bg-transparent text-chrome-muted hover:text-chrome-ink">
        Sign out
      </button>
    </span>
  </header>

  <!-- ── Intent nav ────────────────────────────────────────────────────────
       One row, never wrapping. Nine items: Investigation is the frame, not
       an intent, so it leads and sits before the divider. -->
  <nav id="intent-nav"
       class="no-scrollbar flex flex-nowrap items-center gap-[2px] overflow-x-auto whitespace-nowrap
              border-b border-chrome-line px-4 font-heading text-intent font-semibold"></nav>

  <!-- ── Perspective row ───────────────────────────────────────────────── -->
  <div id="perspective-row"
       class="flex flex-wrap items-center gap-[6px] border-b border-chrome-line px-4 py-[7px]
              text-chip text-chrome-muted"></div>

  <!-- ── Body ──────────────────────────────────────────────────────────── -->
  <!-- Grid columns and their responsive collapse live in the <style> block
       above, keyed on #app-grid — three template-area layouts are clearer as
       media queries than as arbitrary-value utilities. -->
  <div id="app-grid" class="relative min-h-0 flex-1">
    <div id="seam-sidebar" class="seam" role="separator" aria-orientation="vertical"
         aria-label="Resize the sidebar" tabindex="0"></div>
    <div id="seam-rail" class="seam" role="separator" aria-orientation="vertical"
         aria-label="Resize the chat rail" tabindex="0"></div>

    <aside id="sidebar"
           class="pane-sidebar overflow-y-auto border-r border-chrome-line px-s3 py-s4 text-resource text-chrome-ink"></aside>

    <!-- The paper pane. The seam does structural work: this is the artefact,
         everything around it is navigation. -->
    <main id="content" class="pane-content min-w-0 overflow-y-auto bg-paper p-s4 text-ink"></main>

    <aside id="rail"
           class="pane-rail overflow-y-auto border-l border-chrome-line bg-chrome-alt px-s3 py-s4"></aside>
  </div>
</div>

<script type="module" src="/static/next/feedback.js"></script>
<script type="module" src="/static/next/app.js"></script>
</body>
</html>
