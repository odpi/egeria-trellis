swagger: "2.0"
info: {title: Pet Store, version: "1.0.3", description: Swagger 2.0 fixture}
host: petstore.example
basePath: /v2
consumes: [application/json]
produces: [application/json]
securityDefinitions:
  api_key: {type: apiKey, name: api_key, in: header}
security:
  - api_key: []
paths:
  /pets:
    parameters:
      - {name: X-Trace, in: header, type: string, required: false}
    get:
      tags: [pets]
      summary: List pets
      operationId: listPets
      parameters:
        - {name: limit, in: query, type: integer, required: false, description: Max rows}
      responses:
        "200":
          description: A list of pets
          schema: {type: array, items: {$ref: "#/definitions/Pet"}}
        default: {description: Unexpected error, schema: {$ref: "#/definitions/Error"}}
    post:
      tags: [pets]
      summary: Create a pet
      operationId: createPet
      parameters:
        - {name: body, in: body, required: true, schema: {$ref: "#/definitions/Pet"}}
      responses:
        "201": {description: Created}
      security: []
  /pets/{petId}:
    get:
      tags: [pets]
      summary: One pet
      operationId: showPetById
      deprecated: true
      parameters:
        - {name: petId, in: path, required: true, type: string}
      responses:
        "200": {description: The pet, schema: {$ref: "#/definitions/Pet"}}
definitions:
  Pet:
    type: object
    required: [id, name]
    properties:
      id: {type: integer, format: int64}
      name: {type: string}
      tag: {type: string}
  Error:
    type: object
    properties: {code: {type: integer}, message: {type: string}}
