<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>Include or leave out</title>
  <desc>A simplified Curate table for one database: each schema has Include and Leave out buttons, its size, and what
  Egeria holds for it now. Callouts explain a decision, the In Egeria column, leaving out, a suggestion, and an
  undecided row whose state is not known.</desc>
  <defs>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: Menlo, "SF Mono", Consolas, monospace; }
      .ink { fill: #2b2119; }
      .muted { fill: #6b5d50; }
      .teal { fill: #1f6b5c; }
      .rust { fill: #a8502a; }
      .caps { font-weight: 700; letter-spacing: 2.5px; }
      .btn { fill: #ffffff; stroke: #8a7a6a; stroke-width: 1.5; }
      .on { fill: #2b2119; stroke: #2b2119; stroke-width: 1.5; }
      .badge { fill: #a8502a; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="#faf7f2"/>

  <!-- Heading -->
  <text x="80" y="82" class="sans rust caps" font-size="22">CURATE</text>
  <text x="80" y="140" class="serif ink" font-size="48">Include or leave out, one row at a time</text>
  <text x="80" y="188" class="sans muted" font-size="25">For a database, each row is a schema. Nothing goes to Egeria until you publish.</text>

  <!-- Table -->
  <rect x="80" y="230" width="1240" height="620" rx="14" fill="#ffffff" stroke="#d9cbb8" stroke-width="2"/>
  <g class="sans muted caps" font-size="17">
    <text x="104" y="268">DECISION</text>
    <text x="560" y="268">SCHEMA</text>
    <text x="810" y="268">ROWS</text>
    <text x="1000" y="268">IN EGERIA</text>
  </g>
  <g stroke="#e6dccd" stroke-width="1.5">
    <line x1="80" y1="290" x2="1320" y2="290"/>
    <line x1="80" y1="402" x2="1320" y2="402"/>
    <line x1="80" y1="514" x2="1320" y2="514"/>
    <line x1="80" y1="626" x2="1320" y2="626"/>
    <line x1="80" y1="738" x2="1320" y2="738"/>
  </g>

  <!-- Row 1: coco_sus, included, cataloged -->
  <rect x="104" y="306" width="112" height="40" rx="5" class="on"/>
  <text x="160" y="333" class="sans" font-size="21" fill="#ffffff" text-anchor="middle">Include</text>
  <rect x="224" y="306" width="128" height="40" rx="5" class="btn"/>
  <text x="288" y="333" class="sans ink" font-size="21" text-anchor="middle">Leave out</text>
  <text x="104" y="378" class="sans muted" font-size="19">you · 10-06</text>
  <text x="560" y="336" class="mono ink" font-size="22" font-weight="700">coco_sus</text>
  <text x="560" y="370" class="sans muted" font-size="19">30 tables</text>
  <text x="810" y="336" class="sans ink" font-size="21">3,413+</text>
  <text x="1000" y="336" class="sans teal" font-size="21" font-weight="700">✓ cataloged · 30 tables</text>
  <text x="1000" y="370" class="sans muted" font-size="19">checked in Egeria 10-07</text>

  <!-- Row 2: coco_ods, included, cataloged -->
  <rect x="104" y="418" width="112" height="40" rx="5" class="on"/>
  <text x="160" y="445" class="sans" font-size="21" fill="#ffffff" text-anchor="middle">Include</text>
  <rect x="224" y="418" width="128" height="40" rx="5" class="btn"/>
  <text x="288" y="445" class="sans ink" font-size="21" text-anchor="middle">Leave out</text>
  <text x="104" y="490" class="sans muted" font-size="19">you · 10-06</text>
  <text x="560" y="448" class="mono ink" font-size="22" font-weight="700">coco_ods</text>
  <text x="560" y="482" class="sans muted" font-size="19">23 tables</text>
  <text x="810" y="448" class="sans ink" font-size="21">113+</text>
  <text x="1000" y="448" class="sans teal" font-size="21" font-weight="700">✓ cataloged · 23 tables</text>
  <text x="1000" y="482" class="sans muted" font-size="19">checked in Egeria 10-07</text>

  <!-- Row 3: eu_sales, left out -->
  <rect x="104" y="530" width="112" height="40" rx="5" class="btn"/>
  <text x="160" y="557" class="sans ink" font-size="21" text-anchor="middle">Include</text>
  <rect x="224" y="530" width="128" height="40" rx="5" class="on"/>
  <text x="288" y="557" class="sans" font-size="21" fill="#ffffff" text-anchor="middle">Leave out</text>
  <text x="104" y="602" class="sans muted" font-size="19">you · 10-05</text>
  <text x="560" y="560" class="mono ink" font-size="22" font-weight="700">eu_sales</text>
  <text x="560" y="594" class="sans muted" font-size="19">1 table</text>
  <text x="810" y="560" class="sans muted" font-size="21">not measured</text>
  <text x="1000" y="560" class="sans muted" font-size="21">left out · never cataloged</text>

  <!-- Row 4: public, a suggestion -->
  <rect x="104" y="642" width="112" height="40" rx="5" class="btn"/>
  <text x="160" y="669" class="sans ink" font-size="21" text-anchor="middle">Include</text>
  <rect x="224" y="642" width="128" height="40" rx="5" class="btn"/>
  <text x="288" y="669" class="sans ink" font-size="21" text-anchor="middle">Leave out</text>
  <text x="104" y="714" class="sans ink" font-size="19"><tspan class="rust">▸</tspan> suggested: <tspan font-weight="700">leave out</tspan> · <tspan class="rust" text-decoration="underline">confirm</tspan> · <tspan class="rust" text-decoration="underline">include instead</tspan></text>
  <text x="560" y="672" class="mono ink" font-size="22" font-weight="700">public</text>
  <text x="560" y="706" class="sans muted" font-size="19">0 tables</text>
  <text x="810" y="672" class="sans muted" font-size="21">not measured</text>
  <text x="1000" y="672" class="sans muted" font-size="21">—</text>

  <!-- Row 5: demo_auth, undecided, not known -->
  <rect x="104" y="754" width="112" height="40" rx="5" class="btn"/>
  <text x="160" y="781" class="sans ink" font-size="21" text-anchor="middle">Include</text>
  <rect x="224" y="754" width="128" height="40" rx="5" class="btn"/>
  <text x="288" y="781" class="sans ink" font-size="21" text-anchor="middle">Leave out</text>
  <text x="104" y="826" class="sans muted" font-size="19">undecided · keeps what Egeria has now</text>
  <text x="560" y="784" class="mono ink" font-size="22" font-weight="700">demo_auth</text>
  <text x="560" y="818" class="sans muted" font-size="19">4 tables</text>
  <text x="810" y="784" class="sans ink" font-size="21">? not known</text>
  <text x="1000" y="784" class="sans ink" font-size="21">? not known</text>
  <text x="1000" y="818" class="sans muted" font-size="19">no access with this login</text>

  <!-- Badges on the table -->
  <g class="sans" font-size="20" font-weight="700" text-anchor="middle">
    <circle cx="90" cy="326" r="17" class="badge"/><text x="90" y="333" fill="#ffffff">1</text>
    <circle cx="1300" cy="438" r="17" class="badge"/><text x="1300" y="445" fill="#ffffff">2</text>
    <circle cx="90" cy="550" r="17" class="badge"/><text x="90" y="557" fill="#ffffff">3</text>
    <circle cx="90" cy="662" r="17" class="badge"/><text x="90" y="669" fill="#ffffff">4</text>
    <circle cx="1300" cy="774" r="17" class="badge"/><text x="1300" y="781" fill="#ffffff">5</text>
  </g>

  <!-- Callouts -->
  <g class="sans">
    <rect x="1370" y="296" width="470" height="100" rx="10" fill="#f7f2ea" stroke="#b08050" stroke-width="1.5"/>
    <circle cx="1400" cy="330" r="15" class="badge"/><text x="1400" y="337" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <text x="1426" y="337" class="ink" font-size="22" font-weight="700">Your decision, recorded</text>
    <text x="1426" y="370" class="muted" font-size="19">Who decided, and when, shows under it.</text>

    <rect x="1370" y="408" width="470" height="100" rx="10" fill="#f7f2ea" stroke="#b08050" stroke-width="1.5"/>
    <circle cx="1400" cy="442" r="15" class="badge"/><text x="1400" y="449" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <text x="1426" y="449" class="ink" font-size="22" font-weight="700">What Egeria holds now</text>
    <text x="1426" y="482" class="muted" font-size="19">Checked against Egeria, not assumed.</text>

    <rect x="1370" y="520" width="470" height="100" rx="10" fill="#f7f2ea" stroke="#b08050" stroke-width="1.5"/>
    <circle cx="1400" cy="554" r="15" class="badge"/><text x="1400" y="561" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">3</text>
    <text x="1426" y="561" class="ink" font-size="22" font-weight="700">Left out is not lost</text>
    <text x="1426" y="594" class="muted" font-size="19">Include it later, with no new survey.</text>

    <rect x="1370" y="632" width="470" height="100" rx="10" fill="#f7f2ea" stroke="#b08050" stroke-width="1.5"/>
    <circle cx="1400" cy="666" r="15" class="badge"/><text x="1400" y="673" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">4</text>
    <text x="1426" y="673" class="ink" font-size="22" font-weight="700">A suggestion, not a decision</text>
    <text x="1426" y="706" class="muted" font-size="19">Confirm it, or choose the other way.</text>

    <rect x="1370" y="744" width="470" height="100" rx="10" fill="#f7f2ea" stroke="#b08050" stroke-width="1.5"/>
    <circle cx="1400" cy="778" r="15" class="badge"/><text x="1400" y="785" fill="#ffffff" font-size="18" font-weight="700" text-anchor="middle">5</text>
    <text x="1426" y="785" class="ink" font-size="22" font-weight="700">? means not known</text>
    <text x="1426" y="818" class="muted" font-size="19">Not the same as none or zero.</text>
  </g>

  <!-- Footnote -->
  <text x="80" y="930" class="serif ink" font-size="26" font-style="italic">Curate runs no checks. It asks you to decide what inside this data source is worth cataloging today.</text>
  <text x="80" y="990" class="sans muted" font-size="20">Simplified from the Curate page for a database. Repositories and file systems have their own Curate page with the same structure.</text>
  <text x="80" y="1024" class="sans muted" font-size="20">Schema names from the Coco Pharmaceuticals sample data.</text>
</svg>
