<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Look first, catalog what is worth keeping</title>
  <desc>A data source is surveyed; the survey's answers each cite the measurement they came from; you add what only you
  know; you curate, deciding what goes to the catalog; and only your press of Publish sends it to Egeria. Everything
  before Publish is kept in Resource Explorer. Chat answers from the stored results at any point.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b5d50"/>
    </marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6b5c"/>
    </marker>
    <style>
      .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
      .ink { fill: #2b2119; }
      .muted { fill: #6b5d50; }
      .teal { fill: #1f6b5c; }
      .rust { fill: #a8502a; }
      .caps { font-weight: 700; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#faf7f2"/>

  <!-- Heading -->
  <text x="64" y="72" class="sans rust caps" font-size="19">FROM A DATA SOURCE TO THE CATALOG</text>
  <text x="64" y="122" class="serif ink" font-size="40">Look first. Catalog what proves worth keeping.</text>
  <text x="64" y="162" class="sans muted" font-size="21">Every answer shows the measurement it came from. Nothing reaches Egeria until you press Publish.</text>

  <!-- Resource Explorer band -->
  <rect x="48" y="214" width="1094" height="500" rx="14" fill="#ffffff" stroke="#d9cbb8" stroke-width="2"/>
  <text x="74" y="252" class="sans rust caps" font-size="18">RESOURCE EXPLORER</text>
  <text x="74" y="280" class="sans muted" font-size="17">Its own working store, kept while you explore. Surveying again rebuilds it.</text>

  <!-- Egeria band -->
  <rect x="1180" y="214" width="372" height="500" rx="14" fill="#e6f0ee" stroke="#1f6b5c" stroke-width="2"/>
  <text x="1206" y="252" class="sans teal caps" font-size="18">EGERIA</text>
  <text x="1206" y="280" class="sans teal" font-size="17" font-style="italic">the shared catalog</text>

  <!-- Boxes: y 330..470 -->
  <g class="sans" text-anchor="middle">
    <!-- 1 Data source -->
    <rect x="72" y="330" width="166" height="150" rx="10" fill="#f7e8dc" stroke="#b08050" stroke-width="1.5"/>
    <text x="155" y="368" class="ink" font-size="21" font-weight="700">Data source</text>
    <text x="155" y="400" class="muted" font-size="16">a database,</text>
    <text x="155" y="422" class="muted" font-size="16">a folder,</text>
    <text x="155" y="444" class="muted" font-size="16">a code repository</text>

    <!-- 2 Survey -->
    <rect x="286" y="330" width="166" height="150" rx="10" fill="#f0d5c0" stroke="#b08050" stroke-width="1.5"/>
    <text x="369" y="368" class="ink" font-size="21" font-weight="700">Survey</text>
    <text x="369" y="400" class="muted" font-size="16">checks measure it,</text>
    <text x="369" y="422" class="muted" font-size="16">cheap ones first</text>

    <!-- 3 Answers -->
    <rect x="500" y="330" width="166" height="150" rx="10" fill="#e3b795" stroke="#b08050" stroke-width="1.5"/>
    <text x="583" y="368" class="ink" font-size="21" font-weight="700">Answers</text>
    <text x="583" y="400" class="ink" font-size="16">each one shows</text>
    <text x="583" y="422" class="ink" font-size="16">the measurement</text>
    <text x="583" y="444" class="ink" font-size="16">it came from</text>

    <!-- 4 What you know -->
    <rect x="714" y="330" width="166" height="150" rx="10" fill="#d99a6e" stroke="#a8502a" stroke-width="1.5"/>
    <text x="797" y="368" class="ink" font-size="21" font-weight="700">What you know</text>
    <text x="797" y="400" class="ink" font-size="16">owner, sensitivity,</text>
    <text x="797" y="422" class="ink" font-size="16">intended use</text>

    <!-- 5 Curate -->
    <rect x="928" y="330" width="190" height="150" rx="10" fill="#a85a2e" stroke="#8c3d18" stroke-width="1.5"/>
    <text x="1023" y="368" fill="#ffffff" font-size="21" font-weight="700">Curate</text>
    <text x="1023" y="400" fill="#ffffff" font-size="16">you decide what</text>
    <text x="1023" y="422" fill="#ffffff" font-size="16">goes to the catalog,</text>
    <text x="1023" y="444" fill="#ffffff" font-size="16">and why</text>

    <!-- 6 Egeria record -->
    <rect x="1206" y="330" width="320" height="150" rx="10" fill="#ffffff" stroke="#1f6b5c" stroke-width="2"/>
    <text x="1366" y="368" class="teal" font-size="21" font-weight="700">What you published</text>
    <text x="1366" y="400" class="ink" font-size="16">the data source, what you chose</text>
    <text x="1366" y="422" class="ink" font-size="16">to keep, and the survey's report,</text>
    <text x="1366" y="444" class="ink" font-size="16">shared with everyone</text>
  </g>

  <!-- Arrows between boxes -->
  <g stroke="#6b5d50" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="240" y1="405" x2="282" y2="405"/>
    <line x1="454" y1="405" x2="496" y2="405"/>
    <line x1="668" y1="405" x2="710" y2="405"/>
    <line x1="882" y1="405" x2="924" y2="405"/>
  </g>

  <!-- Publish arrow, crossing into Egeria -->
  <line x1="1120" y1="405" x2="1202" y2="405" stroke="#1f6b5c" stroke-width="4" marker-end="url(#teal)"/>
  <rect x="1104" y="300" width="104" height="36" rx="6" fill="#1f6b5c"/>
  <text x="1156" y="324" class="sans" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Publish</text>

  <!-- Chat strip -->
  <rect x="286" y="560" width="832" height="110" rx="10" fill="#f7f2ea" stroke="#d9cbb8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="598" class="sans ink" font-size="20" font-weight="700">Ask in chat, at any point</text>
  <text x="310" y="630" class="sans muted" font-size="17">The answer is built from the stored results and names the ones it used.</text>
  <text x="310" y="654" class="sans muted" font-size="17">When nothing stored can answer, it says which survey would.</text>

  <!-- Egeria reads back -->
  <g class="sans" font-size="17">
    <text x="1206" y="560" class="teal">Resource Explorer reads</text>
    <text x="1206" y="584" class="teal">from Egeria too: what is</text>
    <text x="1206" y="608" class="teal">already cataloged shows</text>
    <text x="1206" y="632" class="teal">beside what you find.</text>
  </g>

  <!-- Footer -->
  <text x="64" y="782" class="sans ink" font-size="21">Most data sources stop early, after a cheap look. Only those worth it go further, and only what you choose is published.</text>
  <text x="64" y="818" class="sans muted" font-size="18">Resource Explorer reads from and writes to Egeria as you, signed in under your own user id.</text>
</svg>
