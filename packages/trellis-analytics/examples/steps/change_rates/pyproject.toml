[project]
name = "trellis-step-change-rates"
dynamic = ["version"]
description = "Analytic Library step: writes per day per table between the latest two activity snapshots RE stored. Installable on its own; installing it is registering it."
requires-python = ">=3.12,<4.0"
dependencies = ["egeria-trellis-analytics>=0.2,<0.3"]

# Installation is registration: Resource Explorer finds the step through this entry point.
[project.entry-points."pyegeria.analytics"]
change_rates = "change_rates.manifest:MANIFEST"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/change_rates/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/change_rates"]
