[project]
name = "trellis-step-fs-activity"
dynamic = ["version"]
description = "Analytic Library step: how long since each file was modified, and read where the mount records access times, from RE's walk rows. Installable on its own; installing it is registering it."
requires-python = ">=3.12,<4.0"
dependencies = ["egeria-trellis-analytics>=0.4,<0.5"]

# Installation is registration: Resource Explorer finds the step through this entry point.
[project.entry-points."pyegeria.analytics"]
fs_activity = "fs_activity.manifest:MANIFEST"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fs_activity/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_activity"]
