[project]
name = "trellis-step-fs-duplicates"
dynamic = ["version"]
description = "Analytic Library step: files with the same content (size and SHA-256), within a file system and across registered ones, from the hashes RE's walk kept. Installable on its own; installing it is registering it."
requires-python = ">=3.12,<4.0"
dependencies = ["trellis-analytics>=0.1.0"]

# Installation is registration: Resource Explorer finds the step through this entry point.
[project.entry-points."pyegeria.analytics"]
fs_duplicates = "fs_duplicates.manifest:MANIFEST"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fs_duplicates/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_duplicates"]

# In this repo the library is the sibling package, three levels up; outside it, trellis-analytics comes from
# wherever the host installed it. pip ignores this table.
[tool.uv.sources]
trellis-analytics = { path = "../../..", editable = true }
