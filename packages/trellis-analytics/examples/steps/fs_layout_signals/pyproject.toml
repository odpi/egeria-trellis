[project]
name = "trellis-step-fs-layout-signals"
dynamic = ["version"]
description = "Analytic Library step: the recognisable structures in a file system (a project, a dataset layout, an archive, backups) from the names on RE's walk rows. Installable on its own; installing it is registering it."
requires-python = ">=3.12,<4.0"
dependencies = ["egeria-trellis-analytics>=0.3.1,<0.4"]

# Installation is registration: Resource Explorer finds the step through this entry point.
[project.entry-points."pyegeria.analytics"]
fs_layout_signals = "fs_layout_signals.manifest:MANIFEST"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fs_layout_signals/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_layout_signals"]
