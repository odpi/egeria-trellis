[project]
name = "trellis-step-fs-change-rates"
dynamic = ["version"]
description = "Analytic Library step: new, modified and removed files and growth between the latest two walks RE kept. Installable on its own; installing it is registering it."
requires-python = ">=3.12,<4.0"
dependencies = ["egeria-trellis-analytics>=0.4,<0.5"]

# Installation is registration: Resource Explorer finds the step through this entry point.
[project.entry-points."pyegeria.analytics"]
fs_change_rates = "fs_change_rates.manifest:MANIFEST"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fs_change_rates/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_change_rates"]
