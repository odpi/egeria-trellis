[project]
name = "trellis-step-fs-permissions"
dynamic = ["version"]
description = "Analytic Library step: owners, groups and modes as counts, and world-readable files with secret-looking names, from RE's walk rows. Installable on its own; installing it is registering it."
requires-python = ">=3.12,<4.0"
dependencies = ["egeria-trellis-analytics>=0.4,<0.5"]

# Installation is registration: Resource Explorer finds the step through this entry point.
[project.entry-points."pyegeria.analytics"]
fs_permissions = "fs_permissions.manifest:MANIFEST"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fs_permissions/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fs_permissions"]
