[project]
name = "trellis-analytics-re"
version = "0.2.0"
description = "Resource Explorer's readers for the Analytic Library (egeria-trellis-analytics): the typed reads of RE's registry and Curate's node set, behind the library's trellis_analytics.readers seam. The library itself moved to odpi/egeria-trellis-analytics in LS2."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    # The library, from its own repository since LS2 (brief section 3): the seam these modules implement
    # (trellis_analytics.readers), the routines, the manifests and the Portal tile's spec. Its wheel declares the
    # pyegeria.analytics and pyegeria.report_specs entry points, so this package declares neither.
    "egeria-trellis-analytics>=0.3.1,<0.4",
    # The pyegeria floor trellis runs against (raised to 6.2.21 on main, 2026-11-04); kept here so this package's
    # floor is never below resource-explorer's, whatever floor the library wheel itself declares.
    "pyegeria>=6.2.21",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
dotenv = ["python-dotenv"]
# registry_view runs RE's own resolve_node_set, so Curate's node set needs RE; resource-explorer registers these readers.
re = ["resource-explorer"]
dev = ["pytest>=8.3.0", "papermill", "ipykernel", "nbformat"]   # the notebook host's test runs the notebook with papermill

[tool.uv.sources]
resource-explorer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis_analytics_re"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
