[project]
name = "trellis-analytics"
version = "0.1.0"
description = "Analytic Library: routines and steps with an honest result envelope (measured / nothing found / not established / not applicable), discovered by the pyegeria.analytics entry point. See docs/extensibility-walking-skeleton-brief.md."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    # Manifests subclass pyegeria's AnalyticFunctionSpec (brief 2a). 6.2.2: an analytic-only FormatSet needs no
    # action function (ISSUE-141) and exec_report_spec builds no Egeria client for a routine with no client
    # parameter (ISSUE-137); the Portal tile relies on both. 6.2.3 (ISSUE-149): the spec carries kind, source,
    # version, envelope, annotation_type, resource_types, family and tags itself, and a chart gets the envelope as its
    # subtitle (ISSUE-139); manifest.py relies on both. 6.2.17 (2026-10-30): #516's resolver allowlist accepts the
    # trellis_analytics prefix, #518's kind "absent" carries not_established / not_applicable, and #519 reads the
    # trellis.analytics entry-point group as an alias of pyegeria.analytics (discovery.register() now redundant).
    # Q2(b) (project owner, 2026-10-31): this package declares pyegeria.analytics only; trellis.analytics is read as an
    # alias (here and in pyegeria) during the split, so nothing in trellis declares it. 6.2.18 (2026-10-31, ISSUE-173)
    # reads the pyegeria.report_specs group below, so installing this package registers the Portal tile's spec.
    # 6.2.19 (2026-11-02) removes PYEGERIA_REPORT_SPEC_MODULES and refuses a dotted analytic_function path.
    "pyegeria>=6.2.21",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
dotenv = ["python-dotenv"]
# curation_coverage counts against RE's own node set (catalogue_scope.resolve_node_set), so it needs RE.
re = ["resource-explorer"]
dev = ["pytest>=8.3.0", "papermill", "ipykernel", "nbformat"]   # the notebook host's test runs the notebook with papermill

# Installation is registration: every manifest the library ships is an entry point, and a report spec names it by its
# registered name.
[project.entry-points."pyegeria.analytics"]
curation_coverage = "trellis_analytics.manifests:CURATION_COVERAGE"
context_pack = "trellis_analytics.manifests:CONTEXT_PACK"
curation_coverage_tile = "trellis_analytics.manifests:CURATION_COVERAGE_TILE"

# The library's report specs (the Portal tile). Decision (project owner, 2026-10-31): "a". pyegeria reads this group
# (ISSUE-173), so installing the package registers the spec; no PYEGERIA_REPORT_SPEC_MODULES setting is needed, and
# pyegeria removed that variable in 6.2.19.
[project.entry-points."pyegeria.report_specs"]
trellis = "trellis_analytics.portal:report_specs"

[tool.uv.sources]
resource-explorer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis_analytics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
