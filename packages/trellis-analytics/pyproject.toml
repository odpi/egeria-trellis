[project]
name = "trellis-analytics"
version = "0.1.0"
description = "Analytic Library: routines and steps with an honest result envelope (measured / nothing found / not established / not applicable), discovered by the trellis.analytics entry point. See docs/extensibility-walking-skeleton-brief.md."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    # Manifests subclass pyegeria's AnalyticFunctionSpec (brief 2a). 6.2.2: an analytic-only FormatSet needs no
    # action function (ISSUE-141) and exec_report_spec builds no Egeria client for a routine with no client
    # parameter (ISSUE-137); the Portal tile relies on both. 6.2.3 (ISSUE-149): the spec carries kind, source,
    # version, envelope, annotation_type, resource_types, family and tags itself, and a chart gets the envelope as its
    # subtitle (ISSUE-139); manifest.py relies on both.
    "pyegeria>=6.2.3",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary"]
dotenv = ["python-dotenv"]
# curation_coverage counts against RE's own node set (catalogue_scope.resolve_node_set), so it needs RE.
re = ["resource-explorer"]
dev = ["pytest>=8.3.0", "papermill", "ipykernel", "nbformat"]   # the notebook host's test runs the notebook with papermill

# Installation is registration: every manifest the library ships is an entry point.
[project.entry-points."trellis.analytics"]
curation_coverage = "trellis_analytics.manifests:CURATION_COVERAGE"
context_pack = "trellis_analytics.manifests:CONTEXT_PACK"

[tool.uv.sources]
resource-explorer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trellis_analytics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
